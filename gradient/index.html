<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>3D Gradient Descent - Local Minima & WebXR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        #overlay {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0, 0, 0, 0.75); padding: 15px; border-radius: 8px; z-index: 10;
            pointer-events: auto; max-width: 320px;
        }
        .legend { display: flex; align-items: center; margin: 6px 0; font-size: 13px; line-height: 1.4; }
        .box { width: 14px; height: 14px; margin-right: 8px; border-radius: 3px; flex-shrink: 0; }
        #stereoBtn {
            margin-top: 10px; padding: 8px 14px; background: #0088cc; width: 100%;
            color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        #stereoBtn:hover { background: #006699; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay">
        <h3 style="margin: 0 0 8px 0; font-size: 16px;">Gradient Descent (Local Minima)</h3>
        <div style="font-size: 13px; margin-bottom: 8px;">
            $J(x) = 2 - \cos(2x_1) - \cos(2x_2) + 0.1(x_1^2 + x_2^2)$
        </div>
        <hr style="border: 0.5px solid #444; margin: 8px 0;">
        <div class="legend"><div class="box" style="background: #ffaa00;"></div> <b>&alpha; = 0.05</b> ก้าวสั้นไป ทำให้ตกและติดหลุม (Local Minimum) ที่ใกล้ที่สุด</div>
        <div class="legend"><div class="box" style="background: #00ff66;"></div> <b>&alpha; = 0.25</b> ก้าวพอดี มีโมเมนตัมกระโดดข้ามหลุมแรกมาลงหลุมที่ลึกกว่าได้</div>
        <div class="legend"><div class="box" style="background: #ff3333;"></div> <b>&alpha; = 0.70</b> ก้าวยาวเกินไป ทำให้กระเด็นกระดอนข้ามไปมาอย่างรุนแรง</div>
        <button id="stereoBtn">สลับโหมด Cardboard VR (Stereopsis)</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // --- 1. Scene, Camera, Renderer Setup ---
        const scene = new THREE.Scene();
        
        // จัด Group สำหรับกราฟ เพื่อให้สามารถเลื่อนจุดศูนย์กลางออกไปให้มองเห็นได้กว้างๆ ใน VR
        const graphGroup = new THREE.Group();
        // เลื่อนกราฟลง 2 เมตร และถอยห่างออกไป 8 เมตรจากจุดศูนย์กลาง (เพื่อให้ VR ยืนมองจากระยะไกล)
        graphGroup.position.set(0, -2, -8);
        scene.add(graphGroup);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        // สำหรับหน้าจอปกติ ตั้งกล้องให้สูงและถอยออกมา
        camera.position.set(0, 8, 4); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // เปิด WebXR
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(VRButton.createButton(renderer));

        // ตั้งจุดโฟกัสของการหมุนเมาส์ ให้มองไปที่ศูนย์กลางของกราฟ
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(graphGroup.position);
        controls.update();

        // แสงสว่าง
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 15, 5);
        scene.add(dirLight);

        // --- 2. Cost Function Surface (Local Minima) ---
        // ฟังก์ชันคล้ายถาดไข่ มีหลุมลวงหลายจุด แต่จุดต่ำสุดจริงๆ อยู่ที่ (0,0)
        const costFunc = (x1, x2) => 2 - Math.cos(2 * x1) - Math.cos(2 * x2) + 0.1 * (x1 * x1 + x2 * x2);
        
        // อนุพันธ์ย่อย (Gradient) ของฟังก์ชัน
        const gradFunc = (x1, x2) => ({ 
            dx1: 2 * Math.sin(2 * x1) + 0.2 * x1, 
            dx2: 2 * Math.sin(2 * x2) + 0.2 * x2 
        });

        const size = 14; // ขยายขนาดให้กว้างขึ้น
        const segments = 120; // เพิ่มความละเอียดตาข่ายเพื่อให้เห็นความโค้งชัด
        const geom = new THREE.PlaneGeometry(size, size, segments, segments);
        geom.rotateX(-Math.PI / 2);

        const pos = geom.attributes.position;
        const colors = [];
        const colorMin = new THREE.Color(0x0044ff);
        const colorMax = new THREE.Color(0xff2200);

        for (let i = 0; i < pos.count; i++) {
            const x1 = pos.getX(i);
            const x2 = pos.getZ(i);
            const y = costFunc(x1, x2);
            pos.setY(i, y);

            // คำนวณสีตามความสูง
            const t = Math.min(Math.max(y / 10.0, 0.0), 1.0);
            const c = colorMin.clone().lerp(colorMax, t);
            colors.push(c.r, c.g, c.b);
        }
        geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geom.computeVertexNormals();

        const surfMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const surface = new THREE.Mesh(geom, surfMat);
        graphGroup.add(surface); // นำไปใส่ใน Group ที่ถอยระยะไว้

        // เส้น Grid ช่วยเน้นมิติ
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.2 });
        graphGroup.add(new THREE.Mesh(geom, wireMat));

        // --- 3. Gradient Descent Paths Simulation ---
        const startPoint = { x1: -5.5, x2: 4.5 }; // เริ่มที่ขอบเพื่อให้เห็นการข้ามหลุม
        const configs = [
            { lr: 0.05, color: 0xffaa00 }, // ติดหลุมแรก
            { lr: 0.25, color: 0x00ff66 }, // กระโดดลงหลุมลึกได้
            { lr: 0.70, color: 0xff3333 }  // แกว่งรุนแรง
        ];

        const runners = configs.map(cfg => {
            let curX1 = startPoint.x1;
            let curX2 = startPoint.x2;
            const pts = [];
            const numSteps = 70; // จำลอง 70 ก้าว

            for (let step = 0; step < numSteps; step++) {
                pts.push(new THREE.Vector3(curX1, costFunc(curX1, curX2) + 0.1, curX2));
                const g = gradFunc(curX1, curX2);
                curX1 -= cfg.lr * g.dx1;
                curX2 -= cfg.lr * g.dx2;

                // ตีกรอบไม่ให้พารามิเตอร์หลุดออกนอกพื้นผิว 14x14
                curX1 = Math.max(-size/2, Math.min(size/2, curX1));
                curX2 = Math.max(-size/2, Math.min(size/2, curX2));
            }

            const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
            const lineMat = new THREE.LineBasicMaterial({ color: cfg.color, linewidth: 3 });
            graphGroup.add(new THREE.Line(lineGeom, lineMat));

            const ball = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 16, 16),
                new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.5 })
            );
            graphGroup.add(ball);

            return { pts: pts, ball: ball, progress: 0 };
        });

        // --- 4. Stereopsis Fallback Setup ---
        let stereopsisMode = false;
        const eyeOffset = 0.035;
        const leftCamera = new THREE.PerspectiveCamera(55, (window.innerWidth / 2) / window.innerHeight, 0.1, 100);
        const rightCamera = new THREE.PerspectiveCamera(55, (window.innerWidth / 2) / window.innerHeight, 0.1, 100);

        document.getElementById('stereoBtn').addEventListener('click', () => {
            stereopsisMode = !stereopsisMode;
            document.getElementById('stereoBtn').innerText = stereopsisMode 
                ? "สลับโหมดกล้องปกติ (Standard 3D)" 
                : "สลับโหมด Cardboard VR (Stereopsis)";
            window.dispatchEvent(new Event('resize')); 
        });

        // --- 5. Render Loop ---
        renderer.setAnimationLoop(() => {
            runners.forEach(r => {
                r.progress += 0.01; // ความเร็วอนิเมชันลูกบอล
                if (r.progress >= r.pts.length - 1) r.progress = 0;

                const idx = Math.floor(r.progress);
                const frac = r.progress - idx;
                r.ball.position.lerpVectors(r.pts[idx], r.pts[idx + 1], frac);
            });

            if (renderer.xr.isPresenting) {
                // VR Mode: ผู้ใช้จะถูกจัดให้อยู่ที่พิกัด 0,0,0 ตามธรรมชาติ 
                // แต่จะมองเห็น Surface อยู่ไกลออกไปที่แกน Z = -8 อย่างชัดเจน
                renderer.render(scene, camera);
            } else if (stereopsisMode) {
                const w = window.innerWidth;
                const h = window.innerHeight;

                leftCamera.position.copy(camera.position);
                leftCamera.rotation.copy(camera.rotation);
                leftCamera.translateX(-eyeOffset);

                rightCamera.position.copy(camera.position);
                rightCamera.rotation.copy(camera.rotation);
                rightCamera.translateX(eyeOffset);

                renderer.setScissorTest(true);

                // จอตาซ้าย
                renderer.setScissor(0, 0, w / 2, h);
                renderer.setViewport(0, 0, w / 2, h);
                leftCamera.aspect = (w / 2) / h;
                leftCamera.updateProjectionMatrix();
                renderer.render(scene, leftCamera);

                // จอตาขวา
                renderer.setScissor(w / 2, 0, w / 2, h);
                renderer.setViewport(w / 2, 0, w / 2, h);
                rightCamera.aspect = (w / 2) / h;
                rightCamera.updateProjectionMatrix();
                renderer.render(scene, rightCamera);

                renderer.setScissorTest(false);
            } else {
                // Desktop/Mobile Normal Mode
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.render(scene, camera);
            }
        });

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
