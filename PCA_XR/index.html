<title>PCA_XR — PCA ของข้อมูลทรงรีในสามมิติ · WebXR</title>
<!-- ============================================================================
  PCA_XR — สื่อการสอน WebXR: การลดมิติด้วย principal component บนข้อมูลจริง

  ข้อมูล: กลุ่มจุดรูป "ทรงรี" (Gaussian ellipsoid) ที่สุ่มใหม่ทุกครั้ง
     · ทิศทางของทรงรี = การหมุนสุ่มสม่ำเสมอ (ไม่ได้อิงแกน x,y,z)
     · ครึ่งแกน σ₁ > σ₂ > σ₃ ต่างกัน 8 เท่าขึ้นไป → เห็นแกนยาวกับแกนสั้นชัด
  สิ่งที่สื่อคำนวณจากข้อมูลจริง (ไม่ใช่รูปที่วาดไว้ก่อน):
     mean x̄ → covariance C = (1/(n−1))Σ(x−x̄)(x̄−x)... → Jacobi eigen →
     λ₁ ≥ λ₂ ≥ λ₃, v₁ ⊥ v₂ ⊥ v₃, อัตราที่อธิบายได้ λ_k/tr C
     และจุดทุกจุดที่ "project" ลงบน v₁ / v₁∧v₂ / v₂∧v₃ / ทิศอื่น ๆ

  หลักของสื่อ: ไม่มีคำอธิบาย ไม่มีประโยค ไม่มีป้ายคำ — มีเฉพาะจุด เส้น แกน
  ตัวเลข และสัญคณิต (λ σ v₁ x̄ tr Ĉ ‖·‖ %) บนแผงตัวเลขกับการ์ดสัญลักษณ์
  คำอธิบายทั้งหมดอยู่ใน README.md · ทุกตัวเลขในโลก 3D มาจาก tools/math_core.mjs
  (ชุดเดียวกับที่ tools/math_check.mjs ตรวจแล้ว 1401 ข้อผ่าน) ไม่มี hardcoded ในไฟล์นี้

  กระจุก default = ขยาย 2 เท่าของฉากพื้นฐาน (ตัวคูณ k = 2 = เพดาน CLUSTER_MAX)
  seed ตัวอย่าง 20261104: กล่องที่วาด 1.59×1.57×2.53 m จุดศูนย์กลางห่าง 2.67 m จากผู้ยืน
  ปรับด้วย ?cluster=1…2 (1 = แบบแผนเดิม) · แบบแผนเวทีอยู่ใน math_core.stageFor/STAGE_BASE
  invariant ที่คงที่ทุกค่า k: หน้าใกล้ของกล่องอยู่ข้างผู้ยืนที่ 1.40 m (จุดทุกจุดไกลกว่านั้น)
  + ฐานล่างกล่องกระจุกอยู่ที่ 1.00 m (ขยายขึ้นด้านบนเท่านั้น ไม่ทับการ์ดเมนู/แผงตัวเลข)
  ราคาที่ต้องจ่ายอย่างซื่อสัตย์: จุดขอบบนสุดสูงขึ้น — วัดจริงมุมเงยไม่เกิน 35° (ขอบทฤษฎี 50.9°)
  ────────────────────────────────────────────────────────────────────────────
  เมนูที่ "ก้มมอง" (การ์ดสัญลักษณ์, จ้องค้าง 1.2 s = สั่งงาน)
  แถว 1  ℝ³ ℝ² ℝ¹  = แสดงทั้งกลุ่ม / เหลือระนาบ v₁∧v₂ / เหลือเส้น v₁ เดียว  ⟳ = ข้อมูลชุดใหม่
  แถว 2  v₂ v₃ u x y z = ทิศอื่นที่ "ลดมิติ" แบบเดียวกัน เพื่อเทียบว่า v₁ เก็บ
         variance ได้มากที่สุดจริง (ตัวเลข % บนการ์ดคำนวณจากข้อมูลชุดเดียวกัน)
  แถว 3  ⟲ reset · ◍ ellipsoid 2σ · ◐ จุดที่ถูกทิ้ง + เส้น drop · μ centering ·
         n = ขนาดตัวอย่าง 300/900/2400 · ⊞ แกนดิบ x y z
  ────────────────────────────────────────────────────────────────────────────
  สิ่งที่จอแบนให้ไม่ได้: ตัดสินว่าจุดไหน "ห่าง" ระนาบที่ project, ว่ากลุ่มจุดหนาแน่น
  ตรงกลางบางตรงขอบ, ว่าแกน v₁ วิ่งตามยาวทรงรีจริง ๆ หรือแค่ภาพ Projection ที่
  บีบทุกอย่างทับกัน, ว่าการเหลือมิติเดียวทำให้กลุ่มจุดกลายเป็น "เส้น" อย่างไร

  การควบคุม
  ────────────────────────────────────────────────────────────────────────────
  ในแว่น (immersive-vr): ก้มมองต่ำกว่าขอบฟ้า 26°…46° แล้วเดินตามทิศที่มอง
     (เกณฑ์เดียวกับ ../walking_xr, ไม่มีจอยสติก) · จ้องการ์ดค้าง 1.2 s = สั่งงาน
  บนจอ: ลากเมาส์/สัมผัส = หัน · Space ค้าง = gaze-walk · WASD เดิน
        1 2 3 = ℝ³ ℝ² ℝ¹ · 4 5 6 7 8 9 = ทิศเทียบ · N ข้อมูลใหม่ · S เปลี่ยน n
        E ellipsoid · D จุดที่ถูกทิ้ง · M centering · T แกนดิบ · R คืนท่า · H ปิด HUD (ทำงานเมื่อ ?ui=1)
  ────────────────────────────────────────────────────────────────────────────
  หน้าแรก (ค่า default — ไม่มี ?ui): บนจอแบนไม่มีข้อความใด ๆ บนหน้าจอเลย มีเพียง 2 ตัวควบคุม
    ปุ่ม "เข้าโหมด VR" (หรือ "เข้าโหมด AR") มุมล่างซ้าย · ลิงก์ "← index" กลับหน้าสารบัญ มุมบนซ้าย
    แผงตัวเลขในโลก 3D (Section 5) ถูกซ่อนบนจอแบน — ในแว่นแผงและการ์ดแสดงตามเดิมเสมอ
  ?ui=1 = คืนข้อความทั้งหมดบนจอแบน: แถบคีย์ด้านบน + HUD ล่าง + แผงตัวเลขในโลก 3D
  ?ui=0 = ปิดแถบคีย์/HUD เหมือนเดิม และปิดลิงก์ ← index ด้วย
  ────────────────────────────────────────────────────────────────────────────
  จุด กระจุก แกน v₁ v₂ v₃ ลูกศรชื่อแกน x y z σ₁ σ₂ และขีด 1σ 2σ = ส่วนของพล็อต แสดงเสมอทุกโหมด
  URL: ?seed= &n=0|1|2 &mode=1|2|3 &basis=pc2|pc3|rnd1|rawx|rawy|rawz &ell=1 &drop=0
       &center=0 &triad=1 &look=pitch,yaw &ui=0|1 &walk=1
  test hook: window.__pca (Section 9 ท้ายไฟล์)
============================================================================ -->

<body>
<!-- หน้าแรก (ค่า default): บนจอแบนไม่มีข้อความเลย — มีเพียง 2 ตัวควบคุม: ปุ่ม "เข้าโหมด VR" (ล่างซ้าย)
     กับลิงก์ "← index" (บนซ้าย, ซ่อนเมื่อ ?ui=0). ในแว่น: ไม่มีข้อความ มีแต่ตัวเลข/สัญคณิตบนแผง
     และการ์ดสัญลักษณ์ตามเดิม. ?ui=1 = คืนแถบคีย์ + HUD + แผงตัวเลข บนจอแบน (ใช้ตอนทดสอบบนจอแบน) -->
<div id="keys" class="mono">
  ลากเมาส์ = มอง · W A S D = เดิน · Space + ก้ม = เดินตามทิศมอง · 1 2 3 = ℝ³ ℝ² ℝ¹ ·
  4 5 6 7 8 9 = ทิศเทียบ · N = ข้อมูลใหม่ · S = เปลี่ยน n · E ellipsoid · D จุดที่ถูกทิ้ง ·
  M = centering · T = แกนดิบ · R = คืนท่า · H ปิด HUD · ในแว่น: ก้มแล้วจ้องการ์ดค้าง 1.2 วิ
</div>

<script type="module">
import * as THREE from 'three';
import * as M from './tools/math_core.mjs';

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║ Section 1 — ค่าคงที่ของการแสดงผล (คณิตทั้งหมดอยู่ใน tools/math_core)      ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
const RAD = Math.PI / 180, TAU = Math.PI * 2;
const EYE = 1.6;                       // ความสูงตาผู้เรียน (m) — ตรงกับที่ math_check ใช้ตรวจ
const WORLD_HALF = 8;                  // เดินได้รอบเวที ±8 m (ห้ามเข้าบริเวณแสดงกระจุก)
const DOT_BASE = [0.020, 0.0125];     // ขนาดจุดพื้นฐาน: ที่ฉายแล้ว / จุดเดิมที่ถูกทิ้ง (m ที่ระยะ 1 m)
const DOT_CORE = 2.6;                  // ระบายสีจุดตาม Mahalanobis radius r/2.6 (แกนกลางสว่าง)
const TICK_SIGMAS = [1, 2];            // ขีดบนแกน PC = σ, 2σ (จาก λ จริง)
const SIG_LAB_MIN = 0.07;              // m จาก x̄: ต่ำกว่านี้ขีด σ ใกล้เกินจนป้ายทับกันเอง (ขีดยังวาด)
const AXIS_LAB_MIN = 0.30;           // m จาก x̄: รัศมีขั้นต่ำของป้ายชื่อแกน (แกนสั้นมากป้ายจะไม่ทับกันตรงกลาง)
const HEAD_R = 0.036, HEAD_L = 0.105, SHAFT_R = 0.0105;

/* gaze dwell — เหมือน ../line_integral_xr และ ../parametric_curves_xr */
const DWELL_MS = 1200, COOLDOWN_MS = 900, CARD_CONE = 6.0 * RAD;
const CARD_ROWS = [
  { pitch: -22, az: [-49, -25, 25, 49] },            // แถว 1: ℝ³ ℝ² ℝ¹ ⟳
  { pitch: -38, az: [-58, -44, -31, 31, 44, 58] },  // แถว 2: ทิศเทียบ v₂ v₃ u x y z
  { pitch: -52, az: [-54, -39, -25, 25, 39, 54] },  // แถว 3: ⟲ ◍ ◐ μ n ⊞
];
const CARD_MIN_H = 0.30;
const CARD_HW = 0.31, CARD_HH = 0.215, CARD_DIST = 3.4;
const rowDist = (pitchDeg) => {
  const p = Math.abs(pitchDeg) * RAD, kMax = (EYE - CARD_MIN_H) / (Math.sin(p) + (CARD_HH / CARD_DIST) * Math.cos(p));
  return Math.min(CARD_DIST, kMax);
};
/* แผงตัวเลขอยู่ต่ำกว่ากระจุก (ขอบบน −22°) — เวทีของกระจุกกินพื้นที่ ±0.55 m ที่ 2 m
   ซึ่งต่ำกว่า −15° จากสายตา จึงไม่ทับแผง และการ์ดทั้งสามแถวยังอยู่ต่ำกว่าสายตา */
const CONSOLE = { az: 0, pitch: -28, dist: 2.05, w: 0.984, h: 0.4374 };
const WALK = { engage: 26, full: 46, maxSpeed: 2.3, maxAccel: 2.5, edgeClear: 1.0, deep: 46 };

const COL = {
  fg: '#eaf6ff', dim: '#8fa6bd', acc: '#4cc9f0', hot: '#ffe08a',
  pc: ['#ffb347', '#4cc9f0', '#ff8fa3'],           // v₁ v₂ v₃
  raw: ['#ff6b6b', '#7ee08a', '#5fb0ff'],          // แกนดิบ x y z
  drop: '#6f879e', plane: '#4cc9f0', ell: '#9fd0ff', mean: '#ffe08a',
};

const Q = new URLSearchParams(location.search);
const UI_ON = Q.get('ui') !== '0';                          /* ?ui=0: ไม่มีลิงก์ ← index (help/HUD ถูกปิดเหมือนเดิม) */
const TEXT_UI = Q.get('ui') === '1';                        /* ?ui=1: แถบคีย์ + HUD + แผงตัวเลขในโลก 3D บนจอแบน */
const FORCE_WALK = Q.get('walk') === '1';

const clamp = (x, lo, hi) => x < lo ? lo : (x > hi ? hi : x);
const clampInt = (v, lo, hi) => (typeof v === 'number' && isFinite(v)) ? Math.round(clamp(v, lo, hi)) : null;
const approach = (v, t, m) => v < t ? Math.min(t, v + m) : Math.max(t, v - m);
const wrapPi = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const fN = (x, d = 4) => (typeof x === 'number' && isFinite(x)) ? x.toFixed(d) : '   —  ';
const fP = (x, d = 1) => (typeof x === 'number' && isFinite(x)) ? (100 * x).toFixed(d) : '—';
const fVec = (v, d = 3) => '(' + v.map(x => (x >= 0 ? ' ' : '') + x.toFixed(d)).join(', ') + ')';

/* ขนาดกระจุกที่วาด = ตัวคูณ k ของแบบแผนเวที · default ×2 ตามที่ผู้ใช้ขอ
   ?cluster=1 = แบบแผนเดิม (0.80×0.79×1.27 m ที่ระยะศูนย์กลาง ~2.0 m) · ?cluster=1.5 · ?cluster=2
   math_core.stageFor/stagePlan รักษาสอง invariant ทุกค่า k: (1) จุดที่ใกล้ตาที่สุดอยู่ไกล
   เป็นระยะด้านข้าง ≥ 1.40 m เสมอ (2) ฐานล่างของกล่องกระจุกอยู่ที่ 1.00 m เสมอ (กระจุกโตขึ้น
   ข้างบนเท่านั้น ไม่ทับการ์ดเมนู/แผงตัวเลข) และขยายทุกเพดานพร้อมกัน = รูปทรงข้อมูลเดิม */
const CLUSTER_K = isFinite(parseFloat(Q.get('cluster'))) ? clamp(parseFloat(Q.get('cluster')), 1, M.CLUSTER_MAX) : M.CLUSTER_MAX;
const SPEC = M.stageFor(CLUSTER_K);

/* ขนาดจุดที่ renderer วาดจริง = ค่าพื้นฐาน × DOT_SCALE × (ระยะเวทีจริง / 2.00 m)
   ตัวคูณท้ายคือการชดเชย: เวทียิ่งถอยออกตามกระจุกที่ใหญ่ขึ้น จุดยิ่งไกลตา — คูณตามระยะ
   แล้ว "มุมบนจอ" ของจุดเท่าเดิมเสมอ (ขนาดเชิงมุม = ค่า DOT_SCALE ที่ระยะมาตรฐาน 2 m)
   default DOT_SCALE = ×2 ตามที่ผู้ใช้ขอ (จุด 2 ซม. → 4 ซม. ที่ระยะ 1 m) · ปรับเองจาก URL:
   ?dots=1 = ขนาดพื้นฐาน · ?dots=1.5 · ?dots=3 · ค่าที่ไม่มี/เกินขอบถูก clamp 0.25…4 */
const DOT_SCALE = clamp(isFinite(parseFloat(Q.get('dots'))) ? parseFloat(Q.get('dots')) : 2, 0.25, 4);
const dotSize = (i) => DOT_BASE[i] * DOT_SCALE * ((D && D.stage ? D.stage.dist : M.STAGE_BASE.dist) / M.STAGE_BASE.dist);

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║ Section 2 — ข้อมูลจริงชุดปัจจุบัน + basis ที่กำลังฉาย                      ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
const S = {
  seed: Number.isFinite(parseFloat(Q.get('seed'))) ? Math.trunc(parseFloat(Q.get('seed'))) : (Date.now() & 0x7fffffff),
  nIdx: [0, 1, 2].includes(parseInt(Q.get('n'), 10)) ? parseInt(Q.get('n'), 10) : 1,
  modeK: [1, 2, 3].includes(parseInt(Q.get('mode'), 10)) ? parseInt(Q.get('mode'), 10) : 3,
  altKey: (Q.get('basis') || null),  // null = โหมด PCA (1/2/3), ไม่งั้น = key ของทิศเทียบ (?basis=)
  ell: Q.get('ell') === '1', drop: Q.get('drop') !== '0', center: Q.get('center') === '1', triad: Q.get('triad') !== '0',
  px: 0, pz: 0, speed: 0, yaw: 0, bodyYaw: 0, bow: 0, moveVec: null,
  hoverKey: null, dwellKey: null, dwellT: 0, lastAct: 0, clock: 0, seq: 0,
};
let D = null;                          // {cloud, pca, stage, alts, altOf, prj, basis, glyphs, kind}
let rebuilt = true;

const nNow = () => M.N_STEPS[S.nIdx];
/** สร้างข้อมูลใหม่ → PCA จริง → แบบแผนเวที → เตรียมทุก basis ที่เมนูมี */
function buildData () {
  const cloud = M.makeCloud(S.seed, nNow());
  const pca = M.pcaOf(cloud);
  const stage = M.stagePlan(pca, SPEC);
  const alts = M.altBases(pca);
  const altOf = Object.create(null);
  for (const a of alts) altOf[a.key] = a;
  D = { cloud, pca, stage, alts, altOf, prj: null, basis: null, glyphs: null, kind: null, axisHalf: null };
  if (stageRing) stageRing.position.z = -stage.dist;      // วงแหวนบนพื้น = ระยะจริงของกระจุกชุดนี้
  S.seq++;
  rebuilt = true;
  applyBasis();
}

let cardGroup = null; const cards = [];

function drawCloudMini (g, box, k) {
  const P = D.pca, { x0, y0, w, h } = box, N = 260, pts = [];

  for (let i = 0; i < N; i++) {
    const q = [0, 0, 0];
    for (let m = 0; m < 3; m++) {
      const c = M.randnFactory(rand)() * P.sigma[m];
      if (m >= k) continue;                                    // ฉายแล้ว = ทิ้งองค์ประกอบนั้น

  for (const [a, b] of pr) { loX = Math.min(loX, a); hiX = Math.max(hiX, a); loY = Math.min(loY, b); hiY = Math.max(hiY, b); }
  const s = Math.min((w - 10) / Math.max(1e-6, hiX - loX), (h - 10) / Math.max(1e-6, hiY - loY));

  for (const [a, b] of pr) g.fillRect(x0 + w / 2 + (a - cx) * s - 1, y0 + h / 2 + (b - cy) * s - 1, 2.4, 2.4);
  g.strokeStyle = COL.pc[0]; g.lineWidth = 2.2; g.beginPath();

}

    { key: 'act:center', glyph: 'μ', sub: '‖μ‖=' + M.vLen(P.mu).toFixed(2) },

   ║ Section 7 — เดินด้วย gaze (เกณฑ์เดียวกับ ../walking_xr)                   ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

function stepTo (nx, nz) {
  if (inField(nx, nz)) { S.px = nx; S.pz = nz; return; }
  const lim = fieldLim();
  let tx = clamp(nx, -lim, lim), tz = clamp(nz, -lim, lim);
  const d = Math.hypot(tx, tz + D.stage.dist) || 1, r = stageClearR();
  if (d < r) { const f = r / d; tx *= f; tz = (tz + D.stage.dist) * f - D.stage.dist; }

  S.speed = approach(S.speed, want, WALK.maxAccel * dt);
  if (S.speed > 1e-6) {
    const hx = S.moveVec ? S.moveVec[0] : -Math.sin(S.yaw), hz = S.moveVec ? S.moveVec[1] : -Math.cos(S.yaw);
    const n = Math.hypot(hx, hz) || 1;
    stepTo(S.px + hx / n * S.speed * dt, S.pz + hz / n * S.speed * dt);
  }
  const dy = wrapPi(S.yaw - S.bodyYaw);
  if (Math.abs(dy) > 6 * RAD) S.bodyYaw += clamp(dy, -1.7 * dt, 1.7 * dt);
}

const keys = Object.create(null);
let spaceHeld = false, dragPrev = null;
let lookPitch = Q.has('look') ? parseFloat(Q.get('look').split(',')[0]) : -6 * RAD;
let lookYaw = Q.has('look') ? parseFloat(Q.get('look').split(',')[1]) : 0;
const canvasEl = renderer.domElement;
canvasEl.addEventListener('pointerdown', (e) => { dragPrev = { x: e.clientX, y: e.clientY }; canvasEl.setPointerCapture?.(e.pointerId); });
canvasEl.addEventListener('pointermove', (e) => {
  if (!dragPrev || renderer.xr.isPresenting) return;
  lookYaw -= (e.clientX - dragPrev.x) * 0.0032; lookPitch = clamp(lookPitch - (e.clientY - dragPrev.y) * 0.0028, -1.35, 1.25);
  dragPrev = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { dragPrev = null; });
addEventListener('wheel', (e) => { lookPitch = clamp(lookPitch - e.deltaY * 0.0007, -1.35, 1.25); }, { passive: true });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / Math.max(1, innerHeight); camera.updateProjectionMatrix();
});
addEventListener('keydown', (e) => {
  const k = (e.key || '').toLowerCase();
  if (k === ' ') { spaceHeld = true; e.preventDefault(); return; }
  if (k === 'arrowleft') { lookYaw += 0.12; return; }
  if (k === 'arrowright') { lookYaw -= 0.12; return; }
  if (k === 'arrowup') { lookPitch = clamp(lookPitch + 0.08, -1.35, 1.25); return; }
  if (k === 'arrowdown') { lookPitch = clamp(lookPitch - 0.08, -1.35, 1.25); return; }
  if (k >= '1' && k <= '3') return setMode(parseInt(k, 10));
  if (k >= '4' && k <= '9') return setAlt(['pc2', 'pc3', 'rnd1', 'rawx', 'rawy', 'rawz'][parseInt(k, 10) - 4]);
  if (k === 'n') return reseed();
  if (k === 's' && e.shiftKey) { cycleN(); return; }
  if (k === 'e') return toggleKey('act:ell');
  if (k === 'd') return toggleKey('act:drop');
  if (k === 'm') return toggleKey('act:center');
  if (k === 't') return toggleKey('act:triad');
  if (k === 'r') return toggleKey('act:pose');
  if (k === 'h') { if (TEXT_UI) { hudBox.style.display = hudBox.style.display === 'none' ? 'block' : 'none'; keysBox.style.display = hudBox.style.display; } return; }
  if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = true; e.preventDefault(); }
});
addEventListener('keyup', (e) => {
  const k = (e.key || '').toLowerCase();
  if (k === ' ') spaceHeld = false;
  if (k === 'w' || k === 'a' || k === 's' || k === 'd') keys[k] = false;
});
const anyKeyMove = () => !!(keys.w || keys.a || keys.s || keys.d);

const xrBtn = document.getElementById('enterXR');
const backIdx = document.getElementById('backIdx');
let xrKind = null;
(async () => {
  if (!('xr' in navigator) || !navigator.xr.isSessionSupported) return;
  try {
    if (await navigator.xr.isSessionSupported('immersive-vr')) xrKind = 'immersive-vr';
    else if (await navigator.xr.isSessionSupported('immersive-ar')) xrKind = 'immersive-ar';
  } catch (e) { xrKind = null; }
  if (xrKind) { xrBtn.style.display = 'block'; xrBtn.textContent = xrKind === 'immersive-ar' ? 'เข้าโหมด AR' : 'เข้าโหมด VR'; }
})();
/* unified first-page UI: ขณะที่ XR session กำลัง presentation — ซ่อนตัวควบคุม DOM ทั้งสอง
   และแผงตัวเลขในโลกแสดงเสมอ (เมื่อออกจากแว่นกลับสู่ gate เดิม: ?ui=1 เท่านั้น) */
renderer.xr.addEventListener('sessionstart', () => {
  xrBtn.style.display = 'none'; if (backIdx) backIdx.style.display = 'none'; syncPanelVisible();
});
renderer.xr.addEventListener('sessionend', () => {
  if (xrKind) xrBtn.style.display = 'block';

  syncPanelVisible();
});
xrBtn.addEventListener('click', async () => {
  if (!xrKind) return;
  try {
    const session = await navigator.xr.requestSession(xrKind, {
      optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay'],
    });
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);

  } catch (err) { console.error('XR session', err); }
});

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║ Section 8 — วนหลัก                                                       ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
let lastT = 0, frames = 0, panelT = 0, hudT = 0;
function tick (tMs) {
  const now = performance.now();
  const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
  lastT = now; S.clock += dt; frames++;

  const presenting = renderer.xr.isPresenting;
  if (!presenting) { camera.rotation.set(lookPitch, lookYaw, 0); camera.position.set(0, EYE, 0); }

  walkControl(dt, presenting);
  rig.position.set(S.px, 0, S.pz);
  world.position.set(-S.px, 0, -S.pz);
  body.rotation.y = S.bodyYaw;

  if (rebuilt) { buildStage(); rebuilt = false; }

  const camObj = presenting ? renderer.xr.getCamera() : camera;
  const camPos = camObj.getWorldPosition(new THREE.Vector3());
  const gaze = new THREE.Vector3(0, 0, -1).applyQuaternion(camObj.getWorldQuaternion(new THREE.Quaternion())).normalize();
  updateCards(dt, gaze, camPos);

  if (now - panelT > 220) { panelT = now; ensureConsole(); drawConsole(); conTex.needsUpdate = true; }   /* วาดแผงตามเดิม แม้ตอนถูกซ่อน */
  if (TEXT_UI && !presenting && now - hudT > 250) { hudT = now; readout.textContent = hudText(); }

  renderer.render(scene, presenting ? camObj : camera);
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║ Section 9 — เริ่มต้น + test hook สำหรับ tools/shot.py                      ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
function cameraHalfAngles () {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  const m = (cam.projectionMatrix && cam.projectionMatrix.elements) || null;
  if (!m || !m[5] || !m[0]) return [45 * RAD, 32 * RAD];
  return [Math.atan(1 / m[0]), Math.atan(1 / m[5])];
}
/** อ่าน geometry ที่ "วาดจริง" จาก scene graph (ไม่ใช้ตัวเลขที่ stagePlan รายงาน)
    วัดเทียบกับตำแหน่งตาจริงของ camera; rig∘world = ตัวแปลงเอกลักษณ์ ดังนั้น
    พิกัดใน BufferAttribute = พิกัดของโลกของเวทีแสดงข้อมูล (walking เลื่อนทั้งสองกลุ่มพร้อมกัน) */
function sceneAudit () {
  scene.updateMatrixWorld(true);
  const camObj = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  const E = camObj.getWorldPosition(new THREE.Vector3());
  const pts = [], others = [], pointDraw = [];
  if (stageGroup) stageGroup.traverse((o) => {
    if (o.isPoints) {
      const a = o.geometry.attributes.position;
      const store = o.userData.kind === 'projected' ? pts : others;
      for (let i = 0; i < a.count; i++) store.push([a.getX(i), a.getY(i), a.getZ(i)]);
      /* ขนาดจุดที่ renderer ใช้จริง (PointsMaterial.size = เส้นผ่านศูนย์กลางในหน่วยเมตรที่ระยะ 1 m) */
      pointDraw.push({ kind: o.userData.kind === 'projected' ? 'projected' : 'raw', n: a.count, size: o.material.size,
        opacity: o.material.opacity, attenuation: !!o.material.sizeAttenuation });
    }
  });
  const pickSample = (list) => {
    const m = Math.min(48, list.length); const out = [];
    if (!m) return out;
    const st = Math.max(1, Math.floor(list.length / m));
    for (let i = 0; i < list.length && out.length < m; i += st) out.push({ i, p: list[i] });
    return out;
  };
  const measure = (list) => {
    const half = [0, 0, 0]; let rMax = 0;
    const C = stageCenterV();
    for (const p of list) {
      half[0] = Math.max(half[0], Math.abs(p[0] - C.x)); half[1] = Math.max(half[1], Math.abs(p[1] - C.y)); half[2] = Math.max(half[2], Math.abs(p[2] - C.z));
      rMax = Math.max(rMax, Math.hypot(p[0] - C.x, p[1] - C.y, p[2] - C.z));
    }
    return { half, rMax };
  };
  const eyeAt = (p) => Math.hypot(p[0] - E.x, p[1] - E.y, p[2] - E.z);
  const all = pts.concat(others);
  /* ความยาวแกนที่วาดจริง: อ่านจาก bounding box ของ geometry ที่ renderer ใช้วาด
     (CylinderGeometry / ConeGeometry สร้างตามแกน +Y ของวัตถุ แล้วหมุนด้วย quaternion) */
  const axes = [];
  const nrm3 = (v) => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; };
  const crs3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const colOf = (e, i) => [e[4 * i], e[4 * i + 1], e[4 * i + 2]];   // three.js เก็บ matrix แบบ column-major, เสาละ 4 ช่อง
  if (stageGroup) stageGroup.traverse((o) => {
    if (o.userData.kind !== 'axis' && o.userData.kind !== 'axisHead') return;
    const g = o.geometry; g.computeBoundingBox();
    const bb = g.boundingBox, sc = o.getWorldScale(new THREE.Vector3());
    const lenLocal = Math.max(bb.max.y - bb.min.y, bb.max.x - bb.min.x, bb.max.z - bb.min.z);
    const reach = o.getWorldPosition(new THREE.Vector3()).distanceTo(stageCenterV());
    /* ทิศที่ renderer ใช้วาดจริง = เสาหลักที่สองของ matrixWorld (local +Y ของ cylinder/cone) */
    const drawn = nrm3(colOf(o.matrixWorld.elements, 1));
    const want = o.userData.wantDir || null;
    axes.push({ kind: o.userData.kind, glyph: o.userData.glyph || null, axisIndex: o.userData.axisIndex === undefined ? -1 : o.userData.axisIndex,
      geomLen: lenLocal * Math.max(sc.x, sc.y, sc.z), reach, drawnDir: drawn, wantDir: want,
      dirMismatch: want ? 1 - Math.abs(drawn[0] * want[0] + drawn[1] * want[1] + drawn[2] * want[2]) : null });
  });
  const axisMaxReach = axes.reduce((w, a) => Math.max(w, a.reach), 0);
  const axisMaxGeomLen = axes.reduce((w, a) => Math.max(w, a.geomLen), 0);
  /* สิ่งที่ "วาดจริง" ในเวที: แผ่นระนาบของโหมด 2 มิติ + ellipsoid — อ่านจุดมุม/ทิศ/ครึ่งแกน
     จาก geometry และ matrixWorld แล้ววัดจุดที่ถูกฉายจริงเทียบกับแผ่นที่วาดจริงเอง
     (ไม่ใช่เทียบกับระนาบที่คณิตศาสตร์รายงาน) */
  let planeNow = null, ellNow = null;
  if (stageGroup) stageGroup.traverse((o) => {
    const kind = o.userData.kind;
    if (kind === 'ellipsoid') {
      const e = o.matrixWorld.elements, h = o.getWorldPosition(new THREE.Vector3());
      ellNow = { center: [h.x, h.y, h.z], wantSemi: o.userData.semi,
        axes: [nrm3(colOf(e, 0)), nrm3(colOf(e, 1)), nrm3(colOf(e, 2))],
        semiDrawn: [Math.hypot(...colOf(e, 0)), Math.hypot(...colOf(e, 1)), Math.hypot(...colOf(e, 2))] };
      return;
    }
    if (kind !== 'plane') return;
    const a = o.geometry.attributes.position, seen = new Map();
    for (let i = 0; i < a.count; i++) {
      const p = [a.getX(i), a.getY(i), a.getZ(i)];
      seen.set(p.map((c) => c.toFixed(6)).join(','), p);
    }
    const cor = [...seen.values()];
    if (cor.length !== 4) { planeNow = { error: 'corner count = ' + cor.length }; return; }
    const ctr = [0, 0, 0];
    for (const p of cor) { ctr[0] += p[0] / 4; ctr[1] += p[1] / 4; ctr[2] += p[2] / 4; }
    const sub3 = (p, q) => [p[0] - q[0], p[1] - q[1], p[2] - q[2]];
    const eu = sub3(cor[1], cor[0]), ev = sub3(cor[3], cor[0]);
    const lu = Math.hypot(...eu), lv = Math.hypot(...ev);
    const u = nrm3(eu), v = nrm3(ev), n = nrm3(crs3(u, v));
    const dg = [Math.hypot(...sub3(cor[0], cor[2])), Math.hypot(...sub3(cor[1], cor[3]))];
    const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    planeNow = { center: ctr, corners: cor, u: u, v: v, nrm: n, half: [lu / 2, lv / 2],
      wantHalf: o.userData.half, wantDirs: o.userData.dirs,
      /* ตรวจว่ากรอบอ้างอิงที่อ่านจากแผ่นเป็นกรอบตั้งฉากจริง (สี่เหลี่ยมมุมฉาก ไม่ใช่ skewed) */
      rectErr: Math.max(Math.abs(dot3(u, v)), Math.abs(dot3(n, u)), Math.abs(dot3(n, v)),
        Math.abs(1 - Math.abs(dot3(n, n))), Math.abs(dg[0] - dg[1]) / Math.max(1e-9, dg[0])) };
  });
  const planeFit = (() => {
    if (!planeNow || !planeNow.u || !pts.length) return null;
    const off = (p, w) => (p[0] - planeNow.center[0]) * w[0] + (p[1] - planeNow.center[1]) * w[1] + (p[2] - planeNow.center[2]) * w[2];
    let offMax = 0, overU = 0, overV = 0, outside = 0;
    for (const p of pts) {
      offMax = Math.max(offMax, Math.abs(off(p, planeNow.nrm)));
      const u = off(p, planeNow.u), v = off(p, planeNow.v);
      overU = Math.max(overU, Math.abs(u) - planeNow.half[0]); overV = Math.max(overV, Math.abs(v) - planeNow.half[1]);
      if (Math.abs(u) > planeNow.half[0] + 1e-5 || Math.abs(v) > planeNow.half[1] + 1e-5) outside++;
    }
    return { offPlaneMax: offMax, overU: overU, overV: overV, pointsOutsideQuad: outside, nPoints: pts.length };
  })();
  const cardAudit = cards.map((cd) => {
    const w = cd.mesh.getWorldPosition(new THREE.Vector3());
    const horiz = Math.hypot(w.x - E.x, -(w.z - E.z));
    const k = cd.mesh.getWorldScale(new THREE.Vector3()).x;
    return { key: cd.key, az: Math.atan2(w.x - E.x, Math.max(0.05, -(w.z - E.z))) / RAD, elev: Math.atan2(w.y - E.y, horiz) / RAD,
      dist: Math.hypot(w.x - E.x, w.y - E.y, w.z - E.z), y: w.y, topY: w.y + CARD_HH * k, botY: w.y - CARD_HH * k };
  });
  const [hh, hv] = cameraHalfAngles();
  let maxAz = 0, maxElev = -90, minElev = 90, dMin = 1e9, dMax = 0, horizMax = 0, horizMin = 1e9, lowY = 1e9;
  for (const p of all) {
    const dx = p[0] - E.x, dz = p[2] - E.z;
    maxAz = Math.max(maxAz, Math.atan2(Math.abs(dx), Math.max(0.05, -dz)));
    const horiz = Math.hypot(dx, dz);
    horizMax = Math.max(horizMax, horiz); horizMin = Math.min(horizMin, horiz);
    const el = Math.atan2(p[1] - E.y, Math.max(0.05, -dz)) / RAD;
    maxElev = Math.max(maxElev, el); minElev = Math.min(minElev, el);
    lowY = Math.min(lowY, p[1]);
    const dd = eyeAt(p); dMin = Math.min(dMin, dd); dMax = Math.max(dMax, dd);
  }
  return {
    nProjected: pts.length, nOther: others.length, pointDraw, drawn: measure(pts), drawnAll: measure(all), axes,
    /* ตัวอย่างจุดที่วาดจริงพร้อม index เดิมของข้อมูล → Python ตรวจ world map ได้ตรง ๆ */
    drawnSample: pickSample(pts), rawSample: pickSample(others),
    plane: planeNow, planeFit: planeFit, ellipsoid: ellNow,
    eyeMin: dMin, eyeMax: dMax, halfAll: measure(all).half,
    cardElevMin: Math.min(...cardAudit.map(c => c.elev)), cardElevMax: Math.max(...cardAudit.map(c => c.elev)), cards: cardAudit,
    maxAzDeg: maxAz / RAD, elevMinDeg: minElev, elevMaxDeg: maxElev,
    halfHorizDeg: hh / RAD, halfVertDeg: hv / RAD,
    azFrac: maxAz / hh, elevFrac: (maxElev - minElev) * RAD / (2 * hv),
    consoleElevDeg: (() => { if (!conMesh) return null; const w = conMesh.getWorldPosition(new THREE.Vector3()); return Math.atan2(w.y - E.y, Math.hypot(w.x - E.x, -(w.z - E.z))) / RAD; })(),
    consoleTopY: conMesh ? conMesh.getWorldPosition(new THREE.Vector3()).y + CONSOLE.h / 2 : null,
    consoleBotY: conMesh ? conMesh.getWorldPosition(new THREE.Vector3()).y - CONSOLE.h / 2 : null,
    axisMaxReach, axisMaxGeomLen, horizMax, horizMin, lowY, eye: [E.x, E.y, E.z],
    stageCenterWorld: (() => { const c = stageCenterV(); return [c.x, c.y, c.z]; })(),
  };
}

window.__pca = {
  ready: true, version: '1', state: S, math: M, stageSpec: SPEC, nSteps: M.N_STEPS,
  clusterSpec: { k: SPEC.k, maxK: M.CLUSTER_MAX, base: M.STAGE_BASE, nearTarget: M.NEAR_TARGET,
    limits: { longMax: SPEC.longMax, vertMax: SPEC.vertMax, depthMax: SPEC.depthMax },
    height: SPEC.height, baseBottom: SPEC.baseBottom },
  dotSpec: { base: DOT_BASE, scale: DOT_SCALE },
  /** numbers ของเวทีที่ "กำลังวาดอยู่จริง" สำหรับชุดข้อมูลปัจจุบัน (shot.py ใช้เทียบกับที่คำนวณเอง) */
  stageNow () {
    const st = D.stage;
    return { k: SPEC.k, scale: st.scale, binding: st.binding, bindingDist: st.bindingDist,
      dist: st.dist, distNear: st.distNear, distWide: st.distWide, center: st.center.slice(),
      drawn: [st.drawnLong, st.drawnVert, st.drawnDepth], worldHalf: { x: st.worldHalf.x, y: st.worldHalf.y, z: st.worldHalf.z },
      dots: [dotSize(0), dotSize(1)] };
  },
  setSeed, reseed, setMode, setAlt, cycleN, toggleKey, act, buildData,
  /** คืนข้อมูลดิบที่หน้านี้อ้างว่าเห็น (ให้ shot.py คำนวณ PCA ใหม่เองใน Python) */
  cloud () {
    const C = D.cloud;
    return { seed: C.seed, n: C.n, mu: C.mu.slice(), points: C.points.map((p) => p.slice()),
      design: { sigma: C.design.sigma.slice(), popCov: C.design.popCov.map((r) => r.slice()), R: C.design.R.map((r) => r.slice()) } };
  },
  basisNow: () => ({ k: D.prj.k, glyphs: D.glyphs.slice(), vectors: D.basis.map((v) => v.slice()), kind: D.kind }),
  look (pitch, yaw) { lookPitch = clamp(pitch, -1.35, 1.25); if (typeof yaw === 'number') lookYaw = yaw; },
  warpTo (x, z) { stepTo(x, z); },
  settle (steps = 4) { for (let i = 0; i < steps; i++) tick(performance.now()); },
  rebuildNow () { buildStage(); rebuilt = false; },
  audit: sceneAudit,
  stats () {
    const P = D.pca, R = D.prj, ST = D.stage, A = sceneAudit();
    return {
      seed: P.seed, n: P.n, nIdx: S.nIdx, kind: D.kind, basisGlyphs: D.glyphs.slice(), basisDim: R.k,
      modeK: S.modeK, altKey: S.altKey,
      mu: P.mu.slice(), values: P.values.slice(), sigma: P.sigma.slice(), vectors: P.vectors.map(v => v.slice()),
      explained: P.explained.slice(), cumulative: P.cumulative.slice(), trace: P.trace, det: P.det,
      charPoly: Object.assign({}, P.charPoly), half: P.half.slice(), radius: P.radius, bbox: P.bbox.slice(),
      jacobi: { sweeps: P.sweeps, off: P.off, residuals: P.residuals.slice(), orthoErr: P.orthoErr, lenErr: P.lenErr },
      projection: {
        k: R.k, keptFrac: R.keptFrac, droppedFrac: R.droppedFrac, keptVar: R.keptVar, droppedVar: R.droppedVar,
        varResidual: R.varResidual, rmseResidual: R.rmseResidual, maxResidual: R.maxResidual,
        sumSqResidual: R.sumSqResidual, coordVar: R.coordVar.slice(), coordVarGap: R.coordVarGap,
        identityGap: R.identityGap, sumSqSig: R.sumSqSig,
      },
      altKept: D.alts.map(a => ({ key: a.key, glyph: a.glyph, kind: a.kind, basis: a.basis.map((v) => v.slice()), keptFrac: keptOf(a.basis) })),
      planeKept: { 'v1^v2': keptOf([P.vectors[0], P.vectors[1]]), 'v1^v3': keptOf([P.vectors[0], P.vectors[2]]), 'v2^v3': keptOf([P.vectors[1], P.vectors[2]]) },
      stage: {
        scale: ST.scale, binding: ST.binding, drawnLong: ST.drawnLong, drawnVert: ST.drawnVert, drawnDepth: ST.drawnDepth,
        radiusWorld: ST.radiusWorld, angularDeg: ST.angularDeg, center: ST.center.slice(),
        dist: ST.dist, distNear: ST.distNear, distWide: ST.distWide, bindingDist: ST.bindingDist,
        nearTarget: ST.nearTarget, height: ST.height, baseBottom: ST.baseBottom,
        ellipsoidSemi: ST.ellipsoidSemi.map(v => v * ST.scale), dataHalf: Object.assign({}, ST.dataHalf),
      },
      scene: (() => { const A = sceneAudit(); return {
        nProjected: A.nProjected, nOther: A.nOther, pointDraw: A.pointDraw, drawnHalf: A.drawn.half, drawnRadius: A.drawn.rMax,
        allHalf: A.halfAll, allRadius: A.drawnAll.rMax, axisTips: A.axes, eyeMin: A.eyeMin, eyeMax: A.eyeMax,
        cardElevMin: A.cardElevMin, cardElevMax: A.cardElevMax, cards: A.cards, consoleElevDeg: A.consoleElevDeg,
        consoleTopY: A.consoleTopY, consoleBotY: A.consoleBotY,
        drawnSample: A.drawnSample, rawSample: A.rawSample,
        plane: A.plane, planeFit: A.planeFit, ellipsoid: A.ellipsoid,
        maxAzDeg: A.maxAzDeg, elevMinDeg: A.elevMinDeg, elevMaxDeg: A.elevMaxDeg,
        axisMaxReach: A.axisMaxReach, axisMaxGeomLen: A.axisMaxGeomLen, axisInfo: A.axes,
        horizMax: A.horizMax, horizMin: A.horizMin, lowY: A.lowY, eye: A.eye, stageCenterWorld: A.stageCenterWorld,
        halfHorizDeg: A.halfHorizDeg, halfVertDeg: A.halfVertDeg, azFrac: A.azFrac, elevFrac: A.elevFrac,
      }; })(),
      toggles: { ell: S.ell, drop: S.drop, center: S.center, triad: S.triad },
      at: [S.px, S.pz], bow: S.bow, walkSpeed: S.speed, frames, seq: S.seq,
    };
  },
};
buildData(); buildStage(); buildCards(); rebuilt = false;
renderer.setAnimationLoop(tick);
window.__pcaReady = true;
</script>
