<script type="module">
import * as THREE from 'three';

/* ============ Section 1 — math only (walking_xr engine + maze generator) ==== */
const RAD = Math.PI / 180;
const params = new URLSearchParams(location.search);
const UI_ON = params.get('ui') !== '0';
const TEXT_UI = params.get('ui') === '1';   /* ?ui=1 = the text/debug overlay */
const FORCE_WALK = params.get('walk') === '1';
const VIEW_MODE = params.get('view');               /* 'overview' | 'goal' | null */
const seedRaw = params.get('seed');
const SEED = seedRaw !== null && isFinite(Number(seedRaw))
  ? Number(seedRaw) >>> 0
  : (Date.now() ^ 0x9e3779b9) >>> 0;

function mulberry32 (seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const MW = 15, MH = 15, CELL = 2, WALLH = 3;
const rng = mulberry32(SEED);
const grid = Array.from({ length: MH }, () => Array(MW).fill('#'));
const DIRS = [[0, -2], [2, 0], [0, 2], [-2, 0]];
{
  const stack = [[1, 1]];
  grid[1][1] = '.';
  while (stack.length) {
    const [cx, cz] = stack[stack.length - 1];
    const opts = DIRS.map(([dx, dz]) => [cx + dx, cz + dz, dx, dz])
      .filter(([nx, nz]) => nx > 0 && nz > 0 && nx < MW - 1 && nz < MH - 1 && grid[nz][nx] === '#');
    if (opts.length) {
      const [nx, nz, dx, dz] = opts[(rng() * opts.length) | 0];
      grid[cz + dz / 2][cx + dx / 2] = '.';
      grid[nz][nx] = '.';
      stack.push([nx, nz]);
    } else stack.pop();
  }
  grid[MH - 2][MW - 1] = '.';   /* exit gate: gap straight through the wall */
}
const MAP = grid.map((row, z) => row.map((ch, x) =>
  (x === 1 && z === 1) ? 'S' : (x === MW - 2 && z === MH - 2) ? 'E' : ch).join(''));
const COLS = MAP[0].length, ROWS = MAP.length;
const isWall = (cx, cz) => {
  if (cx < 0 || cz < 0 || cx >= COLS || cz >= ROWS) return false;
  return MAP[cz][cx] === '#';
};
const cellCenter = (c) => [(c[0] + 0.5) * CELL, (c[1] + 0.5) * CELL];
const startPos = cellCenter([1, 1]);
const goalCell = cellCenter([COLS - 2, ROWS - 2]);
const goalPos = [COLS * CELL + 1.5, goalCell[1]];

const startDir = (() => {
  for (const [dx, dz] of DIRS) if (!isWall(1 + dx / 2, 1 + dz / 2)) return [dx, dz];
  return [0, 2];
})();

const state = {
  seed: SEED,
  px: startPos[0], pz: startPos[1],
  lastHeading: { x: startDir[0], z: startDir[1] },
  speed: 0, bow: 0, pathLen: 0, blockedMsg: '',
  yaw: Math.atan2(-startDir[0], -startDir[1]) / RAD, pitch: 0,
  mode: 'flat', won: false
};
{
  const pPos = params.get('pos');
  if (pPos) {
    const [x, z] = pPos.split(',').map(Number);
    if (isFinite(x) && isFinite(z)) { state.px = x; state.pz = z; }
  }
  const pLook = params.get('look');
  if (pLook) {
    const [pitch, yaw] = pLook.split(',').map(Number);
    if (isFinite(pitch) && isFinite(yaw)) { state.pitch = pitch; state.yaw = yaw; }
  }
}

const WALK = {
  engage: 20, full: 48, maxSpeed: 2.3, maxAccel: 5.0, smoothTau: 0.12,
  bodyRadius: 0.42, ambiguousBow: 70
};
function bowRamp (bowDeg) {
  return Math.max(0, Math.min(1, (bowDeg - WALK.engage) / (WALK.full - WALK.engage)));
}
function targetSpeed (bowDeg) { return WALK.maxSpeed * bowRamp(bowDeg); }
function smoothSpeed (current, target, dt) {
  const k = 1 - Math.exp(-dt / WALK.smoothTau);
  let next = current + (target - current) * k;
  const delta = next - current, lim = WALK.maxAccel * dt;
  if (Math.abs(delta) > lim) next = current + Math.sign(delta) * lim;
  return Math.max(0, next);
}
function headingFrom (fx, fz, bowDeg) {
  const m = Math.hypot(fx, fz);
  if (bowDeg > WALK.ambiguousBow || m < 0.12)
    return { x: state.lastHeading.x, z: state.lastHeading.z, fallback: true };
  return { x: fx / m, z: fz / m, fallback: false };
}

function canOccupy (x, z) {
  const r = WALK.bodyRadius;
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL);
  const z0 = Math.floor((z - r) / CELL), z1 = Math.floor((z + r) / CELL);
  for (let cz = z0; cz <= z1; cz++) for (let cx = x0; cx <= x1; cx++) {
    if (!isWall(cx, cz)) continue;
    const minX = cx * CELL, minZ = cz * CELL;
    const qx = Math.max(minX, Math.min(x, minX + CELL)), qz = Math.max(minZ, Math.min(z, minZ + CELL));
    const dx = x - qx, dz = z - qz;
    if (dx * dx + dz * dz < r * r) return { ok: false, reason: 'WALL' };
  }
  return { ok: true };
}
function advance (heading, distance) {
  let x = state.px, z = state.pz, moved = 0, blocked = null;
  while (moved < distance - 1e-9) {
    const d = Math.min(0.15, distance - moved);
    const nx = x + heading.x * d, nz = z + heading.z * d;
    const c = canOccupy(nx, nz);
    if (!c.ok) { blocked = c.reason; break; }
    x = nx; z = nz; moved += d;
  }
  return { x, z, moved, blocked };
}
function slideMove (dx, dz) {
  let moved = 0;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dz) / 0.15));
  for (let i = 0; i < steps; i++) {
    const sx = dx / steps, sz = dz / steps;
    if (canOccupy(state.px + sx, state.pz + sz).ok) { state.px += sx; state.pz += sz; moved += Math.hypot(sx, sz); continue; }
    if (canOccupy(state.px + sx, state.pz).ok) { state.px += sx; moved += Math.abs(sx); continue; }
    if (canOccupy(state.px, state.pz + sz).ok) { state.pz += sz; moved += Math.abs(sz); continue; }
    break;
  }
  return moved;
}

/* ============ Section 2 — three.js scene (the maze) ======================== */
const scene = new THREE.Scene();
const skyColor = new THREE.Color('#b6cfe4');
scene.background = skyColor;
scene.fog = new THREE.Fog('#c2d3e2', 26, 150);

const VIEW_FOV = 72;
const camera = new THREE.PerspectiveCamera(VIEW_FOV, 1, 0.05, 400);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 0);
camera.focus = 2.0;                      /* จุดรวมสายตา 2 ม. พอดีกับความกว้างทางเดิน */
scene.add(camera);

/* กล้อง Stereo สำหรับ Stereopsis Fallback (iPhone / Cardboard) */
const stereoCamera = new THREE.StereoCamera();
stereoCamera.aspect = 0.5;
stereoCamera.eyeSep = 0.064;             /* 64 มม. ระยะระหว่างตาทั่วไป */

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight('#c8dcec', '#44543c', 0.85));
const keyLight = new THREE.DirectionalLight('#fff3d6', 1.35);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
Object.assign(keyLight.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 1, far: 140 });
keyLight.shadow.camera.updateProjectionMatrix();
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.03;
keyLight.position.set(30, 44, 14);

const world = new THREE.Group();
scene.add(world);
world.add(keyLight);
keyLight.target.position.set(0, 0, 0);
world.add(keyLight.target);

/* ---- procedural textures ---- */
function canvasTex(w, h, painter, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  painter(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const brickTex = canvasTex(512, 512, (g, w, h) => {
  let rnd = 7;
  const R = () => (rnd = (rnd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  g.fillStyle = '#b9a89a'; g.fillRect(0, 0, w, h);
  const bh = 64, bw = 128;
  for (let row = 0; row * bh < h; row++) {
    const off = (row % 2) * bw / 2;
    for (let bx = -bw; bx < w + bw; bx += bw) {
      const v = 0.9 + R() * 0.2;
      g.fillStyle = `rgb(${(176 * v) | 0},${(156 * v) | 0},${(136 * v) | 0})`;
      g.fillRect(bx + off + 2, row * bh + 2, bw - 4, bh - 4);
    }
  }
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(60,50,44,${R() * 0.05})`;
    g.fillRect(R() * w, R() * h, 2 + R() * 4, 2 + R() * 4);
  }
}, [2, 1.4]);
const floorTex = canvasTex(512, 512, (g, w, h) => {
  let rnd = 99;
  const R = () => (rnd = (rnd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  g.fillStyle = '#4f5a60'; g.fillRect(0, 0, w, h);
  const ts = 128;
  for (let ty = 0; ty < h; ty += ts) for (let tx = 0; tx < w; tx += ts) {
    const v = 0.92 + R() * 0.18;
    g.fillStyle = `rgb(${(96 * v) | 0},${(104 * v) | 0},${(112 * v) | 0})`;
    g.fillRect(tx + 3, ty + 3, ts - 6, ts - 6);
  }
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = `rgba(25,28,32,${R() * 0.06})`;
    g.fillRect(R() * w, R() * h, 1 + R() * 3, 2 + R() * 3);
  }
}, [COLS * CELL / 2, ROWS * CELL / 2]);

/* ---- maze geometry ---- */
{
  let wallCount = 0;
  for (let z = 0; z < ROWS; z++) for (let x = 0; x < COLS; x++) if (MAP[z][x] === '#') wallCount++;
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(CELL, WALLH, CELL),
    new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.92, metalness: 0 }), wallCount);
  walls.castShadow = true; walls.receiveShadow = true;
  const m = new THREE.Matrix4();
  let i = 0;
  for (let z = 0; z < ROWS; z++) for (let x = 0; x < COLS; x++) if (MAP[z][x] === '#') {
    m.makeTranslation((x + 0.5) * CELL, WALLH / 2, (z + 0.5) * CELL);
    walls.setMatrixAt(i++, m);
  }
  walls.instanceMatrix.needsUpdate = true;
  world.add(walls);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS * CELL, ROWS * CELL),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  floor.position.set((COLS * CELL) / 2, 0.005, (ROWS * CELL) / 2);
  world.add(floor);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({ color: '#39463d', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set((COLS * CELL) / 2, 0, (ROWS * CELL) / 2);
  world.add(ground);
}

/* ---- exit beacon ---- */
const beaconGroup = new THREE.Group();
beaconGroup.position.set(goalPos[0], 0, goalPos[1]);
{
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 15, 28),
    new THREE.MeshBasicMaterial({ color: '#ffb347', transparent: true, opacity: 0.34,
      fog: false, blending: THREE.AdditiveBlending, depthWrite: false }));
  beam.position.y = 7.5; beaconGroup.add(beam);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 15, 16),
    new THREE.MeshBasicMaterial({ color: '#ffd98a', fog: false }));
  core.position.y = 7.5; beaconGroup.add(core);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.09, 12, 40),
    new THREE.MeshBasicMaterial({ color: '#ffb347', fog: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.07; beaconGroup.add(ring);
  const beaconLight = new THREE.PointLight('#ffc060', 8, 20, 1.6);
  beaconLight.position.y = 3.5; beaconGroup.add(beaconLight);
}
world.add(beaconGroup);

/* ---- canvas-text signs ---- */
function panelMesh(w, h, drawFn) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, fog: false }));
  mesh.scale.set(w / 320, h / 320, 1);
  const redraw = (texts, fg, bg) => {
    drawFn(cv.getContext('2d'), w, h, texts, fg, bg);
    tex.needsUpdate = true;
  };
  return { mesh, redraw };
}
const paintPanel = (g, w, h, texts, fg, bg) => {
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.strokeStyle = fg; g.lineWidth = 10; g.strokeRect(12, 12, w - 24, h - 24);
  g.textAlign = 'center'; g.fillStyle = fg;
  const size = Math.min(88, (w * 0.8) / Math.max(...texts.map(t => Math.max(4, t.length * 0.62))));
  g.font = `bold ${size}px system-ui,'Segoe UI',Verdana,sans-serif`;
  texts.forEach((t, i) => g.fillText(t, w / 2, h * (0.26 + 0.5 * (i / Math.max(1, texts.length - 1)))));
};
const exitSign = panelMesh(1024, 384, paintPanel);
exitSign.redraw(['EXIT = the way out', 'walk through the gap'], '#ffd98a', '#1b2430');
exitSign.mesh.position.set(29, 1.8, 26.04);
exitSign.mesh.rotation.y = 0;
world.add(exitSign.mesh);
const exitSignOut = new THREE.Mesh(exitSign.mesh.geometry, exitSign.mesh.material);
exitSignOut.scale.copy(exitSign.mesh.scale);
exitSignOut.position.set(30.04, 1.8, 24.6);
exitSignOut.rotation.y = Math.PI / 2;
world.add(exitSignOut);

const startSign = panelMesh(1024, 320, paintPanel);
startSign.redraw(['START', 'LOOK DOWN ~20° TO WALK'], '#cde9ff', '#10161f');
startSign.mesh.position.set(startPos[0] - startDir[0] * 0.45, 1.5, startPos[1] - startDir[1] * 0.45);
startSign.mesh.rotation.y = Math.atan2(startDir[0], startDir[1]);
world.add(startSign.mesh);

/* ---- win confetti ---- */
const CONF = 240;
const confGeo = new THREE.BufferGeometry();
const confPos = new Float32Array(CONF * 3), confCol = new Float32Array(CONF * 3), confVel = new Float32Array(CONF * 3);
const palette = ['#ff5d5d', '#5dd75d', '#5d8dff', '#ffd75d', '#ff8dd7'].map(s => new THREE.Color(s));
for (let i = 0; i < CONF; i++) {
  confPos[i * 3] = (Math.random() - 0.5) * 3; confPos[i * 3 + 1] = 3 + Math.random() * 4; confPos[i * 3 + 2] = (Math.random() - 0.5) * 3;
  const col = palette[i % palette.length]; confCol[i * 3] = col.r; confCol[i * 3 + 1] = col.g; confCol[i * 3 + 2] = col.b;
  confVel[i * 3] = (Math.random() - 0.5) * 1.4; confVel[i * 3 + 1] = 1.6 + Math.random() * 1.6; confVel[i * 3 + 2] = (Math.random() - 0.5) * 1.4;
}
confGeo.setAttribute('position', new THREE.BufferAttribute(confPos, 3));
confGeo.setAttribute('color', new THREE.BufferAttribute(confCol, 3));
const confetti = new THREE.Points(confGeo, new THREE.PointsMaterial({ size: 0.08, vertexColors: true, fog: false }));
confetti.position.set(goalPos[0], 0, goalPos[1]);
confetti.visible = false;
world.add(confetti);

/* ---- walking-status ring ---- */
const gazeRing = new THREE.Mesh(
  new THREE.RingGeometry(0.34, 0.46, 48),
  new THREE.MeshBasicMaterial({ color: '#8a9a6a', transparent: true, opacity: 0.5,
    side: THREE.DoubleSide, depthWrite: false, depthTest: false }));
gazeRing.rotation.x = -Math.PI / 2;
gazeRing.visible = false;
scene.add(gazeRing);

/* ============ Section 3 — modes: XR (VR→AR) or flat FPS / Stereo Fallback == */
let stereoMode = false;
let backIdxEl = null, xrBtnEl = null, walkBtnEl = null, exitBtnEl = null, vrDividerEl = null;

function gazeCamera () {
  return (renderer.xr.isPresenting) ? renderer.xr.getCamera() : camera;
}
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
function gazeRayHit () {
  const cam = gazeCamera();
  const o = cam.getWorldPosition(_v1);
  const g = cam.getWorldDirection(_v2);
  const bow = Math.asin(-Math.max(-1, Math.min(1, g.y))) / RAD;
  state.bow = bow;
  let hit = null;
  if (g.y < -0.02 && o.y > 0.02) {
    const t = o.y / -g.y;
    if (t < 40) hit = { x: o.x + g.x * t, y: 0, z: o.z + g.z * t };
  }
  return { hit, bow, gaze: g };
}

/* ---- Gyroscope & Orientation (สำหรับ iPhone / Cardboard VR) ---------------- */
const _zee = new THREE.Vector3(0, 0, 1);
const _euler = new THREE.Euler();
const _q0 = new THREE.Quaternion();
const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const qDevice = new THREE.Quaternion();
const qOffset = new THREE.Quaternion();
let needsRecenter = true;
let deviceOrientation = null;
let orientationActive = false;

function setupDeviceOrientation() {
  if (orientationActive) return;
  const onOrientation = (e) => {
    if (e.alpha !== null || e.beta !== null || e.gamma !== null) {
      deviceOrientation = e;
    }
  };
  window.addEventListener('deviceorientation', onOrientation, true);
  orientationActive = true;
}

function getScreenOrientation() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') {
    return screen.orientation.angle;
  }
  if (typeof window.orientation === 'number') {
    return window.orientation;
  }
  return 0;
}

async function requestOrientationPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      return perm === 'granted';
    } catch (e) {
      console.warn('Orientation permission error:', e);
      return false;
    }
  }
  return true;
}

function updateCameraOrientation() {
  if (deviceOrientation && (deviceOrientation.alpha !== null || deviceOrientation.beta !== null)) {
    const alpha = (deviceOrientation.alpha || 0) * RAD;
    const beta  = (deviceOrientation.beta || 0) * RAD;
    const gamma = (deviceOrientation.gamma || 0) * RAD;
    const orient = getScreenOrientation() * RAD;

    _euler.set(beta, alpha, -gamma, 'YXZ');
    qDevice.setFromEuler(_euler);
    qDevice.multiply(_q1);
    qDevice.multiply(_q0.setFromAxisAngle(_zee, -orient));

    // ปรับระนาบสายตารอบแรก ให้มุ่งหน้าไปตามทางเดินเริ่มต้นของเขาวงกต
    if (needsRecenter) {
      const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(qDevice);
      fwd.y = 0;
      if (fwd.lengthSq() > 1e-4) {
        fwd.normalize();
        const targetFwd = new THREE.Vector3(-Math.sin(state.yaw * RAD), 0, -Math.cos(state.yaw * RAD));
        qOffset.setFromUnitVectors(fwd, targetFwd);
        needsRecenter = false;
      }
    }

    camera.quaternion.multiplyQuaternions(qOffset, qDevice);
  } else {
    camera.rotation.set(state.pitch * RAD, state.yaw * RAD, 0);
  }
}

/* ---- Stereo VR Fallback Functions ----------------------------------------- */
function startStereoVR () {
  stereoMode = true;
  needsRecenter = true;
  state.mode = 'stereo-vr';

  setupDeviceOrientation();

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else if (document.documentElement.webkitRequestFullscreen) {
    document.documentElement.webkitRequestFullscreen();
  }

  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }

  if (exitBtnEl) exitBtnEl.style.display = UI_ON ? 'block' : 'none';
  if (vrDividerEl) vrDividerEl.style.display = 'block';
  if (xrBtnEl) xrBtnEl.style.display = 'none';
  if (backIdxEl) backIdxEl.style.display = 'none';
}

function stopStereoVR () {
  stereoMode = false;
  state.mode = 'flat';
  state.speed = 0;

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  } else if (document.webkitFullscreenElement) {
    document.webkitExitFullscreen();
  }

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  camera.rotation.set(state.pitch * RAD, state.yaw * RAD, 0);

  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);

  if (exitBtnEl) exitBtnEl.style.display = 'none';
  if (vrDividerEl) vrDividerEl.style.display = 'none';
  if (xrBtnEl) {
    xrBtnEl.style.display = UI_ON ? 'inline-block' : 'none';
    xrBtnEl.textContent = xrBtnLabel(xrKind);
  }
  if (backIdxEl) backIdxEl.style.display = UI_ON ? 'block' : 'none';
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && stereoMode) stopStereoVR();
});

/* ---- WebXR: probe immersive-vr -> immersive-ar ---------------------------- */
let xrKind = null;
async function probeXR () {
  if (!navigator.xr) return;
  try {
    if (await navigator.xr.isSessionSupported('immersive-vr')) xrKind = 'immersive-vr';
    else if (await navigator.xr.isSessionSupported('immersive-ar')) xrKind = 'immersive-ar';
  } catch (_) { xrKind = null; }
}
async function enterXR () {
  if (!xrKind) return false;
  try { if (document.pointerLockElement) document.exitPointerLock(); } catch (_) {}
  let session = null;
  try {
    session = await navigator.xr.requestSession(xrKind, {
      optionalFeatures: ['local-floor', 'local'] });
  } catch (_) {
    return false;
  }
  let ok = false;
  for (const space of ['local-floor', 'local']) {
    try {
      renderer.xr.setReferenceSpaceType(space);
      await renderer.xr.setSession(session);
      ok = true; break;
    } catch (_) {
      try { await renderer.xr.setSession(null); } catch (_) {}
    }
  }
  if (!ok) {
    try { await session.end(); } catch (_) {}
    return false;
  }
  state.mode = xrKind === 'immersive-vr' ? 'vr' : 'ar';
  if (state.mode === 'ar' && session.environmentBlendMode && session.environmentBlendMode !== 'opaque')
    scene.background = null;
  if (xrBtnEl) xrBtnEl.style.display = 'none';
  session.addEventListener('end', () => {
    state.mode = 'flat';
    scene.background = skyColor;
    state.speed = 0;
    if (xrBtnEl) { xrBtnEl.style.display = UI_ON ? 'inline-block' : 'none'; xrBtnEl.textContent = xrBtnLabel(xrKind); }
  });
  return true;
}
function xrBtnLabel (kind) { return kind === 'immersive-ar' ? 'เข้าโหมด AR' : 'เข้าโหมด VR'; }

/* ---- flat-mode & touch controls ------------------------------------------- */
const keys = {};
let locked = false, dragging = false, lastT = null;
const lookSens = 0.126;
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stereoMode) {
    stopStereoVR();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === ' ') keys.space = true;
  else if ('wasd'.includes(k)) keys[k] = true;
  else return;
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') keys.space = false;
  else if ('wasd'.includes(k)) delete keys[k];
});
renderer.domElement.addEventListener('click', e => {
  if (renderer.xr.isPresenting || stereoMode || locked) return;
  if (e.pointerType === 'touch') return;
  try { renderer.domElement.requestPointerLock(); } catch (_) {}
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
});
window.addEventListener('mousemove', e => {
  if (!locked && !dragging) return;
  flatLook(-e.movementX * lookSens, -e.movementY * lookSens);
});
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastT = [e.clientX, e.clientY]; });
window.addEventListener('pointerup', () => { dragging = false; lastT = null; });
window.addEventListener('pointermove', e => {
  if (locked || !dragging) return;
  if (e.pointerType === 'mouse') return;
  const dx = -(e.clientX - lastT[0]);
  const dy = -(e.clientY - lastT[1]);
  lastT = [e.clientX, e.clientY];

  if (stereoMode) {
    // ในโหมดสเตอริโอ ลากนิ้วเพื่อหมุนชดเชยทิศทางรอบแกน Y ได้
    const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * 0.0035);
    qOffset.premultiply(rotY);
  } else {
    flatLook(dx * 0.23, dy * 0.23);
  }
});
function flatLook (dyawDeg, dpitchDeg) {
  state.yaw = ((state.yaw + dyawDeg + 180) % 360 + 360) % 360 - 180;
  state.pitch = Math.max(-85, Math.min(85, state.pitch + dpitchDeg));
  camera.rotation.set(state.pitch * RAD, state.yaw * RAD, 0);
}
camera.rotation.set(state.pitch * RAD, state.yaw * RAD, 0);

function isTouchDevice () {
  return (navigator.maxTouchPoints || 0) > 0 || matchMedia('(pointer: coarse)').matches;
}

const VIEW_PRESET = (() => {
  if (VIEW_MODE === 'overview') return { vx: (COLS * CELL) / 2, vz: (ROWS * CELL) / 2, y: 34, pitch: -82, yaw: 0 };
  if (VIEW_MODE === 'goal') {
    return { vx: goalCell[0] - 0.8, vz: goalCell[1], y: 1.7, pitch: 0, yaw: -90 };
  }
  return null;
})();

/* ============ Section 4 — main loop ======================================== */
let prevTime = null;
function tick (tMs) {
  const nowMs = (typeof tMs === 'number' && isFinite(tMs)) ? tMs : performance.now();
  const dt = prevTime === null ? 0.016 : Math.min(0.05, Math.max(0.001, (nowMs - prevTime) / 1000));
  prevTime = nowMs;
  const presenting = renderer.xr.isPresenting || stereoMode;

  if (backIdxEl) backIdxEl.style.display = presenting ? 'none' : 'block';
  if (xrBtnEl) xrBtnEl.style.display = presenting ? 'none' : 'inline-block';
  if (walkBtnEl) walkBtnEl.style.display = presenting ? 'none' : 'inline-block';

  const showSigns = presenting || TEXT_UI;
  exitSign.mesh.visible = showSigns; exitSignOut.visible = showSigns; startSign.mesh.visible = showSigns;

  if (stereoMode) {
    updateCameraOrientation();
  } else if (!presenting && !VIEW_PRESET) {
    camera.rotation.set(state.pitch * RAD, state.yaw * RAD, 0);
  }

  const R = gazeRayHit();
  if (!VIEW_PRESET && R.hit && R.bow >= WALK.engage) {
    gazeRing.position.set(R.hit.x, R.hit.y + 0.02, R.hit.z);
    gazeRing.visible = true;
  } else {
    gazeRing.visible = false;
  }

  const walking = presenting || (state.mode === 'flat' && (keys.space || FORCE_WALK || walkToggle));
  if (walking) {
    state.speed = smoothSpeed(state.speed, targetSpeed(R.bow), dt);
    if (state.speed > 0.005) {
      const h = headingFrom(R.gaze.x, R.gaze.z, R.bow);
      state.lastHeading = { x: h.x, z: h.z };
      const adv = advance(h, state.speed * dt);
      state.pathLen += adv.moved;
      state.px = adv.x; state.pz = adv.z;
      if (adv.blocked) state.blockedMsg = adv.blocked;
      else if (state.blockedMsg) state.blockedMsg = '';
    }
  } else if (state.mode === 'flat') {
    state.speed = 0;
    const fw = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
    const st = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    if (fw || st) {
      const spd = WALK.maxSpeed;
      const fy = state.yaw * RAD;
      const fx = -Math.sin(fy), fz = -Math.cos(fy);
      const rx =  Math.cos(fy), rz = -Math.sin(fy);
      const m = Math.hypot(fw, st);
      const moved = slideMove((fx * fw + rx * st) / m * spd * dt, (fz * fw + rz * st) / m * spd * dt);
      state.pathLen += moved;
      if (moved > 0) state.lastHeading = { x: fx * Math.sign(fw) + rx * Math.sign(st), z: fz * Math.sign(fw) + rz * Math.sign(st) };
    }
  }

  const goalDist = Math.hypot(state.px - goalPos[0], state.pz - goalPos[1]);
  if (!state.won && goalDist < 1.1) {
    state.won = true;
    exitSign.redraw(['YOU ESCAPED!'], '#7dffa8', '#10241a');
    confetti.visible = true;
  }
  if (state.won) {
    const pos = confGeo.attributes.position.array;
    for (let i = 0; i < CONF; i++) {
      pos[i * 3] += confVel[i * 3] * dt;
      pos[i * 3 + 1] += confVel[i * 3 + 1] * dt;
      pos[i * 3 + 2] += confVel[i * 3 + 2] * dt;
      confVel[i * 3 + 1] -= 2.2 * dt;
      if (pos[i * 3 + 1] < 0.05) pos[i * 3 + 1] = 0.05;
    }
    confGeo.attributes.position.needsUpdate = true;
  }

  if (VIEW_PRESET) {
    world.position.set(-VIEW_PRESET.vx, 0, -VIEW_PRESET.vz);
    camera.position.y = VIEW_PRESET.y;
    camera.rotation.set(VIEW_PRESET.pitch * RAD, VIEW_PRESET.yaw * RAD, 0);
  } else {
    world.position.set(-state.px, 0, -state.pz);
  }

  if (TEXT_UI && !presenting) {
    readoutEl.textContent = [
      'mode : ' + state.mode + (state.blockedMsg ? '  ' + state.blockedMsg : ''),
      'pos  : ' + state.px.toFixed(2) + ', ' + state.pz.toFixed(2) +
        '   exit ' + goalDist.toFixed(1) + ' m away',
      'speed: ' + state.speed.toFixed(2) + ' m/s   gaze-bow ' + Math.round(state.bow) + '°   path ' + state.pathLen.toFixed(1) + ' m',
      'seed : ' + state.seed + (state.won ? '   🎉 YOU ESCAPED THE MAZE!' : ''),
    ].join('\n');
  }

  if (stereoMode) {
    // เรนเดอร์ 2 ฝั่งด้วย StereoCamera
    const halfW = Math.floor(innerWidth / 2);
    camera.updateMatrixWorld();
    stereoCamera.update(camera);

    const autoClear = renderer.autoClear;
    renderer.autoClear = false;
    renderer.clear();
    renderer.setScissorTest(true);

    // ตาซ้าย
    renderer.setScissor(0, 0, halfW, innerHeight);
    renderer.setViewport(0, 0, halfW, innerHeight);
    renderer.render(scene, stereoCamera.cameraL);

    // ตาขวา
    renderer.setScissor(halfW, 0, innerWidth - halfW, innerHeight);
    renderer.setViewport(halfW, 0, innerWidth - halfW, innerHeight);
    renderer.render(scene, stereoCamera.cameraR);

    renderer.setScissorTest(false);
    renderer.autoClear = autoClear;
  } else {
    renderer.render(scene, renderer.xr.isPresenting ? renderer.xr.getCamera() : camera);
  }
}

/* ============ Section 5 — DOM initialization =============================== */
if (UI_ON) {
  const a = document.createElement('a');
  a.id = 'backIdx';
  a.href = '../index.html';
  a.textContent = '← index';
  document.body.appendChild(a);
  backIdxEl = a;

  exitBtnEl = document.createElement('button');
  exitBtnEl.id = 'exitVR';
  exitBtnEl.textContent = '✕ ออกจาก VR';
  exitBtnEl.addEventListener('click', (e) => {
    e.stopPropagation();
    stopStereoVR();
  });
  document.body.appendChild(exitBtnEl);

  vrDividerEl = document.createElement('div');
  vrDividerEl.id = 'vrDivider';
  document.body.appendChild(vrDividerEl);
}

const helpEl = document.createElement('div');
helpEl.id = 'help';
helpEl.innerHTML =
  '<h1>Maze Walk — find the way out (WebXR)</h1>' +
  'In VR/AR: <b>look down about 20° from the horizon</b> and you walk smoothly toward where you look ' +
  '(straight, left or right). Look deeper = walk faster. Look up = stop.' + '<br>' +
  'The maze has random junctions but <b>only one route leads out</b> — the rest ' +
  'are dead ends; a new map is drawn on each load ' +
  '(same map again: add <b>?seed=N</b> to the URL).' + '<br>' +
  'The exit is a <b>gap in the wall</b>: walk through it out to the beacon to escape.' + '<br>' +
  'This screen (no XR): <b>WASD</b> walk, mouse or finger drag = look around, ' +
  '<b>hold Space</b> = try the same gaze-walk.' + '<br>' +
  '<span class="warn">Safety: clear an area ≥2×2 m or stay seated. Stop when dizzy.</span>';
if (TEXT_UI) document.body.appendChild(helpEl);

const hudEl = document.createElement('div');
hudEl.id = 'hud';
const readoutEl = document.createElement('pre');
readoutEl.id = 'readout';
hudEl.appendChild(readoutEl);
if (TEXT_UI) document.body.appendChild(hudEl);

let walkToggle = false;
function addWalkBtn () {
  if (!TEXT_UI) return;
  const b = document.createElement('button');
  b.id = 'walkBtn';
  b.textContent = 'WALK';
  b.addEventListener('click', () => {
    walkToggle = !walkToggle;
    b.textContent = walkToggle ? 'STOP' : 'WALK';
  });
  hudEl.appendChild(b);
  walkBtnEl = b;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* debug hooks */
window.__app = {
  status () {
    const dist = Math.hypot(state.px - goalPos[0], state.pz - goalPos[1]);
    return { mode: state.mode, px: state.px, pz: state.pz, speed: state.speed,
             bow: state.bow, path: state.pathLen, heading: state.lastHeading,
             look: { pitch: state.pitch, yaw: state.yaw },
             blocked: state.blockedMsg, won: state.won, goalDist: dist,
             seed: state.seed, map: MAP, startPos, goalPos, startDir,
             walls: MAP.join('').split('#').length - 1, ring: gazeRing.visible,
             presenting: (renderer.xr.isPresenting || stereoMode), xrKind };
  },
  setPlayer (x, z) { state.px = x; state.pz = z; },
  setLook (pitchDeg, yawDeg) { state.pitch = pitchDeg; state.yaw = yawDeg; },
  probe (x, z) { return canOccupy(x, z); },
  scene,
  enterXR,
  startStereoVR,
  stopStereoVR
};

/* probe XR และสร้างปุ่มเข้าโหมด VR (พร้อม fallback เป็น Stereopsis) */
probeXR().then(() => {
  if (UI_ON) {
    const btn = document.createElement('button');
    btn.id = 'xrBtn';
    btn.textContent = xrBtnLabel(xrKind);
    btn.addEventListener('click', async () => {
      // ขอสิทธิ์ Gyroscope บน iOS ภายใน gesture ของผู้ใช้
      await requestOrientationPermission();

      const ok = await enterXR();
      if (!ok) {
        // Fallback เป็นโหมดจำลองแบ่งจอสองฝั่ง (Stereo VR)
        startStereoVR();
      }
    });
    document.body.appendChild(btn);
    xrBtnEl = btn;
  }
  if (isTouchDevice()) addWalkBtn();
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setAnimationLoop(tick);
});
</script>
</body>
