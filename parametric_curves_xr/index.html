<!-- ============================================================================
  parametric_curves_xr — สื่อการสอน WebXR: เส้นโค้งพาราเมตริกในสามมิติ
  r(t) = (Ax sin(at+α), By sin(bt+β), Cz sin(ct+γ)) ด้วย t ตัวเดียว

  หลักของสื่อ: ไม่มีคำอธิบาย ไม่มีประโยค ไม่มีป้ายคำ มีเฉพาะภาพ ตัวเลข และสัญคณิต
  คำอธิบายทั้งหมดอยู่ใน README.md และ lesson12.tex (§12.6.7)
  ทุกตัวเลขบนจอมาจาก tools/math_core.mjs (ชุดเดียวกับ tools/math_check.mjs)
  ไม่มีการ hardcode ผลลัพธ์ในไฟล์นี้

  ผู้เรียนยืน "inside" เส้น: แอมพลิจูด 7×7×4 m เส้นต่ำสุดอยู่เหนือหัว 2.5 m
  4 พรีเซต (การ์ดแถว 1 / ปุ่ม 1 2 3 4)
  ────────────────────────────────────────────────────────────────────────────
  1  a=b=c      : ทุกเฟส = เส้นในระนาบเดียว (เส้นตรง / วงรี) — เงาบนพื้นเป็นเส้นตรง
  2  อัตราส่วน 1:1:2, 1:2:2, 1:1:3 : เส้นบนพื้นทรงกระบอกเงา = "ขึ้นลง 2,3 รอบต่อ 1 รอบ"
  3  อัตราส่วน 1:2:3 = 2:4:6 = 3:6:9 : รูปร่างเดียวกันเป๊ะ คาบต่างกัน T, T/2, T/3
     และ 3:4:5, 2:3:5 : ลูปปิดที่คาบ T (ครบ 3,4,5 รอบพร้อมกัน) ไม่ใช่ครึ่งคาบ
  4  1:1:√2 (ปิดไม่ได้) เทียบ 5:5:7 และ 12:12:17 : อัตราส่วนใกล้ √2 = เส้นเกือบปิด
  ────────────────────────────────────────────────────────────────────────────
  สิ่งที่จอแบนให้ไม่ได้: ตัดสินว่าส่วนใดของท่อ "ใกล้–ไกล" ตัวเรา, ว่าเส้นข้ามตัวเอง
  หรือแค่บังกัน, ว่าจุดกลับถึงจุดเริ่ม = 0 จริงหรือเพียง "เกือบ", ว่าหุ่นบนเส้นเคลื่อน
  เร็วไม่สม่ำเสมอ (ขีดเวลาห่างเท่ากันแต่ระยะห่างบนเส้นต่างกัน 2 เท่า)

  การควบคุม
  ────────────────────────────────────────────────────────────────────────────
  ในแว่น (immersive-vr): ก้มมองต่ำกว่าขอบฟ้า ≥ 20° แล้วเดินตามทิศที่มอง
    (เกณฑ์เดียวกับ ../walking_xr, ไม่มีจอยสติก) · จ้องการ์ดค้าง 1.2 s = สั่งงาน
  บนจอ: ลากเมาส์/สัมผัส = หัน · Space ค้าง = gaze-walk · WASD เดิน
        1 2 3 4 พรีเซต · [ ] เลือกเส้นในพรีเซต · C เดิน/หยุด · G เร็ว
        F Δφ (เลื่อนเฟสแกน z) · V เปิด/ปิดเงาบนพื้น · R เริ่มเส้นใหม่ · H ปิด/เปิด HUD (ทำงานเมื่อ ?ui=1)
  ────────────────────────────────────────────────────────────────────────────
  หน้าแรก (ค่า default — ไม่มี ?ui): บนจอแบนไม่มีข้อความใด ๆ บนหน้าจอเลย มีเพียง 2 ตัวควบคุม
    ปุ่ม "เข้าโหมด VR" (หรือ "เข้าโหมด AR") มุมล่างซ้าย · ลิงก์ "← index" กลับหน้าสารบัญ มุมบนซ้าย
    แผงตัวเลขในโลก 3D (Section 5) ถูกซ่อนบนจอแบน — ในแว่นแผงและการ์ดแสดงตามเดิมเสมอ
  ?ui=1 = คืนข้อความทั้งหมดบนจอแบน: แถบคีย์ด้านบน + HUD ล่าง + แผงตัวเลขในโลก 3D
  ?ui=0 = ปิดแถบคีย์/HUD เหมือนเดิม และปิดลิงก์ ← index ด้วย
  ────────────────────────────────────────────────────────────────────────────
  เส้นโค้ง แกน ลูกศรชื่อแกน x y z และขีดเวลาบนเส้น = ส่วนของพล็อต แสดงเสมอทุกโหมด
  URL: ?preset= ?variant= ?speed= ?tfrac= ?play=0 ?shadow=0 ?ph= ?ui=0|1 ?look=pitch,yaw ?walk=1
  test hook: window.__pc (Section 9 ท้ายไฟล์)
============================================================================ -->

<!-- หน้าแรก (ค่า default): บนจอแบนไม่มีข้อความเลย — มีเพียง 2 ตัวควบคุม: ปุ่ม "เข้าโหมด VR" (ล่างซ้าย)

<script type="module">
import * as THREE from 'three';
import * as M from './tools/math_core.mjs';

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║ Section 1 — ค่าคงที่ของการแสดงผล (คณิตทั้งหมดอยู่ใน tools/math_core)      ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
const RAD = Math.PI / 180, TAU = Math.PI * 2;
const EYE = 1.6;                       // ความสูงตาผู้เรียน (m)
/* ─ เวทีแสดงเส้น (stage) ─
   เส้นจริงกินพื้นที่ 14×14×8 m ถ้าวาดขนาดเต็ม ผู้เรียนต้องอยู่ใต้เส้นและเงยคอมอง
   ที่นี่จึง "ห่อ" ทั้งเส้นให้ลอยอยู่ตรงหน้า: จุดที่ใกล้ตัวที่สุดอยู่ห่าง nearM เมตร
   ไม่มีจุดใดของเส้นสูงเกิน up° จากแนวสายตา (ไม่ต้องแหงน) และไม่ลอดพื้น
   ผลคือแบบจำลองย่อส่วน ×s ที่ทั้งเส้นอยู่ในกรอบการมองโดยไม่ต้องหันหัว
   ค่าปัจจุบัน = แบบจำลอง 120% ของรุ่นก่อน และระยะใกล้ 0.6 เท่าของรุ่นก่อน
   (nearM 4.3→2.58 m, ค่าเฉลี่ย s 0.218→0.261 = ×1.20 ตามที่ผู้สอนขอ)                  */
const STAGE = { nearM: 2.58, upDeg: 9, fitH: 0.78, clearM: 0.0, centerDeg: -7, maxS: 0.60 };
/* ─ การ "วาดซ้ำ" (ดู Section 4) ─ รอบแรกวาดจากพื้นที่ว่าง; พอครบหนึ่งคาบทั้งเส้น
   ค่อย ๆ จางลงเอง ส่วนที่หุ่นวิ่งผ่านแล้วถูกวาดทับให้เข้มกลับเป็นเดิม               */
const PAINT = { dim: 0.14, fadeLap: 0.55, glow: 0.34, glowW: 0.02, shDim: 0.34 };
const WORLD_HALF = 8;                // เดินได้รอบเวที ±8 m (ห้ามเข้าบริเวณแสดงเส้น: see walkControl)
const TUBE_RADIAL = 5;               // ด้านของท่อ
const SHADOW_R = 0.05;               // ท่อเงาบนพื้น
const TICK_N = 32;                   // จำนวนขีดเวลาเท่ากันที่ติดบนเส้น
const GHOST_N = 700;                 // จำนวนจุดที่ใช้เทียบสองเส้น (เงาบนพื้น / ตัวเส้น)
const TICK_R = 0.115;
const SPEED_STEPS = [0.15, 0.40, 1.20];   // รอบ/วินาที ของ oscillator ที่เร็วที่สุด
const DEFAULT_SPEED = 1;
const PHASE_STEP = 22.5;             // Δφ ต่อการจ้องการ์ด Δφ หนึ่งครั้ง (ใส่ที่แกน z)

/* gaze dwell — เหมือน ../line_integral_xr และ ../geodesic */
const DWELL_MS = 1200, COOLDOWN_MS = 900, CARD_CONE = 6.0 * RAD, CARD_DIST = 3.4;
/* การ์ดผูกกับลำตัว (bodyYaw) ตรงกลางว่างให้เป็นของเส้นและคอนโซล */
/* การ์ดผูกกับลำตัว (bodyYaw): ทั้งเมนูอยู่ต่ำกว่าสายตา — แถวบนสุดต้องก้ม 22°
   แถวล่างสุด ≈ 52° (ต่ำกว่าเดิม 30°) ระยะของแต่ละแถวถูกจำกัดให้การ์ดอยู่เหนือพื้น
   และย่อขนาดตามระยะเพื่อว่า "มุมที่การ์ดกินในสายตา" คงเดิมทุกแถว                    */
const CARD_ROWS = [
  { pitch: -22, az: [-49, -33, 33, 49] },          // แถว 1: พรีเซต 1 2 3 4
  { pitch: -38, az: [-58, -44, -31, 31, 44, 58] }, // แถว 2: เส้นโค้งในพรีเซตที่เลือก
  { pitch: -52, az: [-54, -39, -25, 25, 39, 54] }, // แถว 3: ⟲ ▶ ‖ ⏩ Δφ ◐ ⧉
];
const CARD_MIN_H = 0.30;                             // ขอบล่างของการ์ดต้องอยู่เหนือพื้นเท่านี้
const CARD_HW = 0.31, CARD_HH = 0.215;              // ขนาดการ์ดมาตรฐานที่ระยะ CARD_DIST
const rowDist = (pitchDeg) => {                     // ระยะไกลสุดที่ขอบล่างการ์ดยังอยู่เหนือพื้น
  const p = Math.abs(pitchDeg) * RAD, kMax = (EYE - CARD_MIN_H) / (Math.sin(p) + (CARD_HH / CARD_DIST) * Math.cos(p));
  return Math.min(CARD_DIST, kMax);
};
/* แผงตัวเลข: ก้ม ≈ 28° จากแนวสายตา เล็กเท่าเดิม 60% (ผู้สอนขอ) เพื่อบังเส้นน้อยลง
    ขอบบนอยู่ที่ −22° · ขอบล่างยังอยู่เหนือพื้น · เลี่ยงแนว az ของการ์ดทุกแถว
    ราคา: canvas 1440×640 เท่าเดิมแต่แผงเล็กลง ตัวอักษร 24px จึงเหลือสูง ≈16 mm ที่ระยะ 2.05 m
    = ≈0.46° ในสายตา (จาก ≈0.76° เดิม) — อ่านได้บนจอแบนผ่าน HUD แต่ในแว่นยังไม่แน่ใจ   */
const CONSOLE = { az: 0, pitch: -28, dist: 2.05, w: 0.984, h: 0.4374 };
/* gaze-walk: ก้ม 26°…46° จากทิศที่มองจึงเดิน; มองตรง = ดูเส้น, ก้มลึกกว่า 46° = กำลังใช้เมนู
   และห้ามเดินเข้าไปในบริเวณของแบบจำลอง (keep-out รอบจุดศูนย์กลางเวที) */
const WALK = { engage: 26, full: 46, maxSpeed: 2.3, maxAccel: 2.5, edgeClear: 1.0, deep: 46 };

const Q = new URLSearchParams(location.search);
const UI_ON = Q.get('ui') !== '0';                          /* ?ui=0: ไม่มีลิงก์ ← index (help/HUD ถูกปิดเหมือนเดิม) */
const TEXT_UI = Q.get('ui') === '1';                        /* ?ui=1: แถบคีย์ + HUD + แผงตัวเลขในโลก 3D บนจอแบน */
const FORCE_WALK = Q.get('walk') === '1';

const clamp = (x, lo, hi) => x < lo ? lo : (x > hi ? hi : x);
const clampInt = (v, lo, hi) => (typeof v === 'number' && isFinite(v)) ? Math.round(clamp(v, lo, hi)) : null;
const approach = (v, t, m) => v < t ? Math.min(t, v + m) : Math.max(t, v - m);
const wrapPi = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const fN = (x, d = 4) => (typeof x === 'number' && isFinite(x)) ? x.toFixed(d) : '   —  ';
const intOr = (x) => (typeof x === 'number' && isFinite(x)) ? (Number.isInteger(x) ? String(x) : String(x)) : '—';

/* ─ เครื่องห่อเส้น: หาขนาด/ตำแหน่งของเวทีแสดงเส้นจากเส้นจริง + กรอบมองของกล้อง ─
   s = มาตราส่วนแบบจำลอง, D = ระยะถึงระนาบกึ่งกลาง, L = ความสูงของระนาบ z=0 ของแบบจำลอง
   หา s ที่ใหญ่ที่สุดที่ยังอยู่ครบในกรอบ โดยจุดที่ใกล้ที่สุดอยู่ห่าง nearM พอดี        */
let ST = { s: 0.2, D: 5.2, L: 1.3 }, stKey = '', VISK = 0.55;
const visR = (x) => clamp(x * VISK, 0.05, x);        // ขนาดของที่ประกอบ: ท่อ/ขีด/หุ่น/ลูกศร

function cameraHalfAngles () {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  const m = (cam.projectionMatrix && cam.projectionMatrix.elements) || null;
  if (!m || !m[5] || !m[0]) return [45 * RAD, 32 * RAD];
  return [Math.atan(1 / m[0]), Math.atan(1 / m[5])];
}
function fitStage (v) {
  const N = 420, P = [];
  for (let i = 0; i <= N; i++) P.push(M.point(v, v.span * i / N));
  const [hh, hv] = cameraHalfAngles();
  const tanH = Math.tan(Math.min(hh * STAGE.fitH, hv * STAGE.fitH * 2.0));
  const up = Math.tan(STAGE.upDeg * RAD), dn = Math.tan(Math.min(46 * RAD, hv * 0.95));
  let minP1 = 1e9; for (const p of P) minP1 = Math.min(minP1, p[1]);
  const place = (s) => {                              // ระยะ = ให้จุดที่ใกล้ที่สุดห่าง nearM พอดี
    const D = STAGE.nearM - s * minP1;
    let lo = -1e9, hi = 1e9;
    for (const p of P) {
      const dep = s * p[1] + D;
      if (Math.abs(p[0]) * s > tanH * dep) return null;                 // กว้างเกินกรอบมอง
      const hiC = EYE + up * dep - s * p[2]; if (hiC < hi) hi = hiC;    // ไม่แหงนเกิน up°
      const loC = Math.max(STAGE.clearM - s * p[2], EYE - dn * dep - s * p[2]);
      if (loC > lo) lo = loC;                                            // ไม่ลอดพื้น
    }
    if (lo > hi + 1e-9) return null;
    const want = EYE + Math.tan(STAGE.centerDeg * RAD) * D;
    return { s, D, L: Math.min(Math.max(want, lo), hi) };
  };
  let lo = 0.04, hi = STAGE.maxS, best = place(lo);
  const top = place(hi); if (top) best = top;
  else for (let it = 0; it < 46; it++) {
    const m = (lo + hi) / 2, r = place(m);
    if (r) { lo = m; best = r; } else hi = m;
  }
  return best || { s: 0.18, D: STAGE.nearM + 1.3, L: 1.3 };
}
function ensureStage (force) {
  const [hh, hv] = cameraHalfAngles();
  const key = S.v.f.join(',') + '|' + S.v.phDeg.join(',') + '|' + hh.toFixed(3) + '|' + hv.toFixed(3);
  if (!force && key === stKey) return false;
  stKey = key;
  const r = fitStage(S.v);
  ST = r; VISK = Math.pow(clamp(r.s, 0.05, 1), 0.55);
  buildAxes();
  return true;
}

function colorAt (v, t, out) {
  const w = [0, 0, 0];
  for (let i = 0; i < 3; i++) {
    const s = Math.sin(v.f[i] * t + v.ph[i]);                // −1..1 ของแกน i
    w[i] = 0.16 + 0.84 * (0.5 + 0.5 * s);
  }
  out.setRGB(w[0], w[1], w[2]);
  return out;
}

class SampledCurve extends THREE.Curve {
  constructor (pts) { super(); this.pts = pts; }
  getPoint (u, target = new THREE.Vector3()) {
    const n = this.pts.length - 1;
    const uu = clamp(Number.isFinite(u) ? u : 0, 0, 1) * n;         // TubeGeometry ขอ u ทั้งในและนอก [0,1]
    const i = Math.min(Math.floor(uu), n - 1), f = uu - i, a = this.pts[i], b = this.pts[i + 1];
    return target.set(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, a.z + (b.z - a.z) * f);
  }
}

  const p = M.point(v, S.t), vel = M.velocity(v, S.t), sp = M.norm(vel), P = to3(p);
  marker.position.copy(P); halo.position.copy(P);
  marker.scale.setScalar(k); halo.scale.set(1.5 * k, 1.5 * k, 1);
  colorAt(v, S.t, markerMat.color);

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║ Section 6 — การ์ดสัญลักษณ์ (เลข/สัญคณิต/ภาพย่อเท่านั้น) + gaze dwell        ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
let cardGroup = null; const cards = [];
function newCardCanvas () { const c = document.createElement('canvas'); c.width = 256; c.height = 176; return c; }

/* ภาพย่อ = เส้นจริงของข้อนั้น projected (ไม่มีคำ) พร้อมเงาบนพื้นเป็นเส้นสีจาง */
function drawCurveMini (g, v, box) {
  const { x0, y0, w, h } = box;
  const NS = 420, P = [], Qs = [];
  for (let i = 0; i <= NS; i++) {
    const p = M.point(v, v.span * i / NS);
    P.push([p[0], p[2], p[1]]);                       // (x, z, y) เพื่อ projected ที่เอียงลง
    Qs.push([p[0], 0, p[1]]);
  }
  let loX = 1e9, hiX = -1e9, loY = 1e9, hiY = -1e9;
  const proj = ([X, Z, Y]) => [X * 0.86 - Y * 0.42, -(Z * 0.80 + (X * 0.30 + Y * 0.30))];
  for (const q of P) { const [a, b] = proj(q); loX = Math.min(loX, a); hiX = Math.max(hiX, a); loY = Math.min(loY, b); hiY = Math.max(hiY, b); }
  const s = Math.min((w - 12) / Math.max(1e-6, hiX - loX), (h - 12) / Math.max(1e-6, hiY - loY));
  const put = ([X, Z, Y]) => { const [a, b] = proj([X, Z, Y]); return [x0 + (w - (hiX - loX) * s) / 2 + (a - loX) * s, y0 + (h - (hiY - loY) * s) / 2 + (b - loY) * s]; };
  g.strokeStyle = '#26405c'; g.lineWidth = 1.5; g.beginPath();
  Qs.forEach((q, i) => { const [a, b] = put(q); i ? g.lineTo(a, b) : g.moveTo(a, b); }); g.stroke();
  for (let i = 0; i <= NS; i += 2) {
    const p = P[i], [a, b] = put(p);
    const cx = 0.16 + 0.84 * (0.5 + 0.5 * Math.sin(v.f[0] * v.span * i / NS + v.ph[0]));
    const cy = 0.16 + 0.84 * (0.5 + 0.5 * Math.sin(v.f[1] * v.span * i / NS + v.ph[1]));
    const cz = 0.16 + 0.84 * (0.5 + 0.5 * Math.sin(v.f[2] * v.span * i / NS + v.ph[2]));
    g.strokeStyle = `rgb(${Math.round(cx * 255)},${Math.round(cy * 255)},${Math.round(cz * 255)})`;
    g.lineWidth = 2.2; g.beginPath();
    if (i) { const q = put(P[i - 1]); g.moveTo(q[0], q[1]); } else g.moveTo(a, b);
    g.lineTo(a, b); g.stroke();
  }
}
function drawCardFace (cd) {

  g.fillStyle = 'rgba(10,18,28,0.92)'; g.fillRect(0, 0, 256, 176);
  g.strokeStyle = cd.hot ? COL.acc : '#22384d'; g.lineWidth = cd.hot ? 6 : 3; g.strokeRect(3, 3, 250, 170);
  if (cd.kind === 'preset' || cd.kind === 'variant') drawCurveMini(g, cd.v, { x0: 8, y0: 26, w: 240, h: 142 });
  else {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 62px ui-monospace, "DejaVu Sans Mono", monospace'; g.fillStyle = COL.fg;
    g.fillText(cd.glyph, 128, 74);
    if (cd.sub) { g.font = '700 22px ui-monospace, "DejaVu Sans Mono", monospace'; g.fillStyle = COL.dim; g.fillText(cd.sub, 128, 138); }
    g.textAlign = 'left'; g.textBaseline = 'top';
  }
  g.font = '700 24px ui-monospace, "DejaVu Sans Mono", monospace';
  g.fillStyle = cd.kind === 'preset' ? COL.acc : (cd.kind === 'variant' ? COL.fg : '#7f93a8');
  g.fillText(cd.badge, 12, 6);
  if (cd.sub && (cd.kind === 'preset' || cd.kind === 'variant')) {
    g.font = '700 15px ui-monospace, "DejaVu Sans Mono", monospace'; g.fillStyle = COL.dim;
    g.textAlign = 'right'; g.fillText(cd.sub, 244, 8); g.textAlign = 'left';
  }

/* จุดกลางฉาก = จุดเริ่มเดิน; ห้ามออกนอกสนาม ±8 m และห้ามเดินเข้าไปในเวทีแสดงเส้น */

  if (TEXT_UI && !presenting && now - hudT > 250) { hudT = now; readout.textContent = hudText(); }

/* วัดจริงว่า "เส้นอยู่ในกรอบมองโดยไม่ง้อการแหงน" เป็นอย่างไร:

   เทียบครึ่งกรอบจริงของกล้อง azFrac/elevFrac คือเศษของครึ่งกรอบที่ใช้ */
function frameCheck () {
  const v = S.v, half = cameraHalfAngles();
  let maxAz = 0, minElev = 1e9, maxElev = -1e9, minD = 1e9, maxD = 0;
  const N = 900;
  for (let i = 0; i <= N; i++) {

    const dz = -p.z, horiz = Math.hypot(p.x, dz);            // dz > 0 = ระยะข้างหน้า

  setPlaying (on) { S.playing = !!on; refreshUtil(); },
  setTime (t) { S.t = clamp(typeof t === 'number' ? t : 0, 0, S.v.span); S.sArc = M.arcLength(S.v, 0, S.t, 6000); S.kPeriods = S.v.closed ? Math.floor(S.t / S.v.T) : 0; },
  warpTo (x, z) { stepTo(x, z); },
  look (pitch, yaw) { lookPitch = clamp(pitch, -1.35, 1.25); lookYaw = yaw; },
  settle (steps = 3) { for (let i = 0; i < steps; i++) tick(performance.now()); },
  stats () {
    const v = S.v, p = M.point(v, S.t);
    return {
      presetId: v.presetId, presetTag: v.presetTag, tag: v.tag, ratio: v.ratio, ratioLow: v.ratioLow,
      f: v.f.slice(), phDeg: v.phDeg.slice(), closed: v.closed, T: v.T, span: v.span,
      gcd: v.gcd, cyclesAtPeriod: v.cyclesAtPeriod,
      samples: v.samples, tubeSegments: tube ? tube.geometry.attributes.position.count : 0,
      L: v.L, speedMin: v.speedMin, speedMax: v.speedMax,
      closestGap: v.closest.gap, closestAt: v.closest.at,
      earlyReturn: v.closed ? M.earlyReturn(v, v.span, 3000) : null,
      planarityDeviation: M.planarityDeviation(v, v.span, 600),
      cylinderDeviation: M.cylinderDeviation(v, v.span, 2000),
      shadowCrossings: M.shadowCrossings(v, v.span, 700),
      tickSpacing: M.tickSpacings(v, v.span, TICK_N),
      compare: S.ghost ? {
        tag: S.ghost.tag, ratio: S.ghost.ratio, closed: S.ghost.closed, T: S.ghost.T, L: S.ghost.L,
        samples: S.ghost.samples, shadowGap: S.ghostGap.shadow, curveGap: S.ghostGap.curve, n: GHOST_N,
      } : null,
      t: S.t, kPeriods: S.kPeriods, sArc: S.sArc,
      sExact: M.arcLength(v, 0, S.t, 8000),
      point: p, gapNow: M.gapToStart(v, S.t), speedNow: M.speed(v, S.t),
      cycles: M.cyclesDone(v, S.t), aligned: M.allAligned(v, S.t, 3e-3),
      playing: S.playing, speedIdx: S.speedIdx, showShadow: S.showShadow, phaseSteps: S.phaseSteps,
      at: [S.px, S.pz], bow: S.bow, walkSpeed: S.speed, frames,
      stage: { s: ST.s, D: ST.D, L: ST.L, nearM: (ST.D - ST.s * Math.max(...[M.AMP.x, M.AMP.y])), modelM: [2 * M.AMP.x * ST.s, 2 * M.AMP.y * ST.s, 2 * M.AMP.z * ST.s], keepOutR: stageClearR() },
      paint: (() => {
        const ps = paintState(), w = (x) => { x -= Math.floor(x); return x; };
        const probe = [ps.head - 0.03, ps.head - 0.30, ps.head + 0.30].map(u => { u = w(u); return { u, k: paintFactor(u, ps, PAINT.dim) }; });
        return Object.assign({}, ps, { reveal: revealFraction(), probe });
      })(),
    };
  },
  /** เดินเวลาแบบก้าวคงที่ (ไม่พึ่ง wall clock) ให้ผลทำซ้ำได้สำหรับเทสต์ */
  run (seconds, dt = 1 / 60) {
    const v = S.v, omega = TAU * SPEED_STEPS[S.speedIdx] / Math.max(...v.f);
    let n = 0; for (let i = 0; i < seconds / dt; i++) { if (!S.playing) break; advanceTime(omega * dt); n++; } return n;
  },
};
window.__pcReady = true;
</script>
